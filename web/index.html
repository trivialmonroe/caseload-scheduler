<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Caseload — Scheduler</title>
  <style>
    :root {
      --ink: #1c1917;
      --muted: #78716c;
      --line: #e7e5e4;
      --paper: #faf7f2;
      --card: #fff;
      --accent: #0f766e;
      --accent-2: #c2410c;
      --ok: #166534;
      --bad: #b91c1c;
      --open: #dcfce7;
      --blocked: #fecaca;
      --off: #e7e5e4;
      --shadow: 0 1px 2px rgba(28,25,23,.06), 0 8px 24px rgba(28,25,23,.06);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
      background: var(--paper);
      color: var(--ink);
      display: grid;
      grid-template-columns: 220px 1fr;
      grid-template-rows: 56px 1fr;
      grid-template-areas: "top top" "nav main";
    }
    .top {
      grid-area: top;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      background: var(--card);
      border-bottom: 1px solid var(--line);
    }
    .brand { font-weight: 700; letter-spacing: -.02em; font-size: 1.05rem; }
    .brand span { color: var(--accent); }
    .top .grow { flex: 1; }
    .status {
      font-size: 13px; color: var(--muted); max-width: 42%;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .status.ok { color: var(--ok); }
    .status.bad { color: var(--bad); }
    button, .btn {
      font: inherit; cursor: pointer; border-radius: 8px;
      border: 1px solid var(--line); background: var(--card); padding: 7px 12px;
    }
    button:hover, .btn:hover { background: #f5f5f4; }
    button.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
    button.primary:hover { background: #44403c; }
    button.ghost { border-color: transparent; background: transparent; color: var(--muted); }
    aside {
      grid-area: nav;
      background: #fff;
      border-right: 1px solid var(--line);
      padding: 12px 8px;
      display: flex; flex-direction: column; gap: 2px;
    }
    aside .sec { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 10px 10px 4px; }
    aside button.nav {
      width: 100%; text-align: left; border: none; background: transparent;
      padding: 8px 10px; border-radius: 8px; color: var(--ink);
    }
    aside button.nav.active { background: #ecfdf8; color: var(--accent); font-weight: 600; }
    main { grid-area: main; overflow: auto; padding: 20px 24px 48px; }
    h1 { font-size: 1.4rem; margin: 0 0 4px; letter-spacing: -.02em; }
    .lede { color: var(--muted); margin: 0 0 18px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 12px;
      padding: 16px; box-shadow: var(--shadow);
    }
    .card h3 { margin: 0 0 8px; font-size: 1rem; }
    .meta { font-size: 12px; color: var(--muted); line-height: 1.45; }
    .stack { display: flex; flex-direction: column; gap: 14px; }
    .pill { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 99px; background: #f5f5f4; margin-right: 4px; }
    .pill.teal { background: #ccfbf1; color: #115e59; }
    .pill.warn { background: #ffedd5; color: #9a3412; }
    .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
    .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
    .stat b { display: block; font-size: 1.4rem; letter-spacing: -.03em; }
    .stat span { color: var(--muted); font-size: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--card); }
    th, td { border-bottom: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
    th { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); background: #fafaf9; }
    tr.under td { background: #fef2f2; }
    tr.met td { background: #f0fdf4; }
    tr.auto td { background: #f5f3ff; }
    .chip-row { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 4px; }
    .chip {
      border: 1px solid var(--line); border-radius: 99px; padding: 5px 11px; font-size: 12px; background: #fff; cursor: pointer;
    }
    .chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
    input, select, textarea {
      font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; width: 100%; background: #fff;
    }
    label { font-size: 12px; font-weight: 600; display: block; margin: 0 0 6px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; align-items: start; }
    .modal-bg {
      position: fixed; inset: 0; background: rgba(28,25,23,.4); display: flex; align-items: center; justify-content: center; z-index: 50;
    }
    .modal { background: #fff; border-radius: 16px; width: min(560px, 92vw); max-height: 90vh; overflow: auto; padding: 20px; box-shadow: var(--shadow); }
    .cal { overflow-x: auto; }
    .cal-grid { display: grid; grid-template-columns: 64px repeat(5, 1fr); min-width: 720px; border: 1px solid var(--line); background: #fff; }
    .cal-grid > div { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); min-height: 28px; font-size: 11px; padding: 2px; }
    .cal-head { background: var(--ink); color: #fff; text-align: center; padding: 8px !important; font-weight: 600; }
    .sess {
      border-radius: 6px; padding: 4px 6px; color: #fff; font-size: 11px; line-height: 1.25; height: 100%;
    }
    .heat td.open { background: var(--open); }
    .heat td.blocked { background: var(--blocked); font-size: 10px; }
    .heat td.off { background: var(--off); }
    .drop {
      border: 1.5px dashed var(--line); border-radius: 12px; padding: 16px; text-align: center; color: var(--muted); margin-bottom: 12px;
      background: #fff;
    }
    .drop.hot { border-color: var(--accent); background: #f0fdfa; }
    .hidden { display: none !important; }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 14px; }
    .tabs button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
    .stale {
      background: #fff7ed; border: 1px solid #fed7aa; color: #9a3412;
      padding: 10px 12px; border-radius: 10px; margin-bottom: 16px; font-size: 13px;
    }
    .setup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: start; }
    .setup-col { min-width: 0; display: flex; flex-direction: column; gap: 16px; }
    .setup-col h2 { margin: 0; font-size: 1.12rem; letter-spacing: -.02em; }
    .setup-col > .meta { margin: 0; }
    .setup-col > .row { margin: 0; }
    @media (min-width: 981px) {
      .setup-col + .setup-col { border-left: 1px solid var(--line); padding-left: 28px; }
    }
    .wizard {
      background: #fff; border: 1px solid var(--line); border-radius: 12px;
      padding: 16px 18px; margin-bottom: 18px; box-shadow: var(--shadow);
    }
    .wizard h3 { margin: 0 0 6px; font-size: 1rem; }
    .wizard .meta { margin: 0 0 4px; }
    .wizard ol { margin: 10px 0 0; padding-left: 20px; }
    .wizard li { margin: 8px 0; }
    .wizard li.done { color: var(--ok); }
    .wizard .card-actions { margin-top: 12px; }
    .popover {
      position: relative; z-index: 40; background: #fff; border: 1px solid var(--line);
      border-radius: 14px; padding: 16px 18px; box-shadow: var(--shadow); margin: 0 0 18px; max-width: 720px;
    }
    .popover h3 { margin: 0 0 6px; }
    .card-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    .field { margin-top: 12px; }
    .week-cals, .open-grids { display: flex; flex-direction: column; gap: 20px; }
    .card.cal h3 { margin: 0 0 12px; }
    .sess.on { outline: 2px solid var(--ink); outline-offset: 1px; }
    .mob-nav { display: none; }
    .card.student { cursor: pointer; }
    .card.student:hover { border-color: #d6d3d1; }
    .modal { width: min(680px, 94vw); }
    .modal-sec { border-top: 1px solid var(--line); margin-top: 18px; padding-top: 16px; }
    .block-item { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-top: 10px; background: #fafaf9; }
    .pill.ok { background: #dcfce7; color: #166534; }
    .pill.bad { background: #fee2e2; color: #b91c1c; }
    .pill.warn { background: #ffedd5; color: #9a3412; }
    button.danger { color: var(--bad); }
    details.adv { margin-top: 16px; }
    details.adv summary { cursor: pointer; color: var(--muted); font-weight: 600; }
    input[type="time"] { min-height: 38px; }
    .sess { cursor: pointer; }
    .sess:hover { filter: brightness(1.08); }
    @media print {
      aside, .top, .no-print, .mob-nav, .tabs, .wizard, .stale, .popover { display: none !important; }
      body { display: block; background: #fff; }
      main { padding: 0; }
      .week-cals { gap: 24px; }
      .card.cal { break-inside: avoid; box-shadow: none; }
      body.print-week h1,
      body.print-week .lede,
      body.print-week .stat-grid,
      body.print-week .row { display: none !important; }
    }
    @media (max-width: 980px) {
      .setup-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 720px) {
      body { grid-template-columns: 1fr; grid-template-rows: 56px auto 1fr; grid-template-areas: "top" "mob" "main"; }
      aside { display: none; }
      .mob-nav {
        display: flex; grid-area: mob; gap: 6px; padding: 8px 12px; overflow-x: auto;
        background: #fff; border-bottom: 1px solid var(--line);
      }
      .mob-nav button { white-space: nowrap; }
      .mob-nav button.active { background: #ecfdf8; color: var(--accent); font-weight: 600; }
      .stat-grid { grid-template-columns: 1fr 1fr; }
      .form-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="top">
    <div class="brand">Caseload <span>Scheduler</span></div>
    <div class="grow"></div>
    <div class="status" id="status">Ready</div>
    <button type="button" onclick="validateNow()">Check</button>
    <button type="button" class="primary" onclick="generateNow()">Generate schedule</button>
    <button type="button" id="undo-btn" class="hidden" onclick="undoLastGenerate()">Undo generate</button>
  </div>
  <aside>
    <div class="sec">Caseload</div>
    <button type="button" class="nav active" data-view="students" onclick="showView('students')">Students</button>
    <button type="button" class="nav" data-view="setup" onclick="showView('setup')">Hours &amp; grades</button>
    <div class="sec">Schedule</div>
    <button type="button" class="nav" data-view="schedule" onclick="showView('schedule')">Week &amp; coverage</button>
    <div class="sec">File</div>
    <button type="button" class="nav" data-view="files" onclick="showView('files')">Import / export</button>
    <button type="button" class="nav" data-view="settings" onclick="showView('settings')">Settings</button>
  </aside>
  <nav class="mob-nav">
    <button type="button" data-view="students" onclick="showView('students')">Students</button>
    <button type="button" data-view="setup" onclick="showView('setup')">Hours &amp; grades</button>
    <button type="button" data-view="schedule" onclick="showView('schedule')">Schedule</button>
    <button type="button" data-view="files" onclick="showView('files')">File</button>
    <button type="button" data-view="settings" onclick="showView('settings')">Settings</button>
  </nav>
  <main id="main"></main>
  <input id="filePick" type="file" class="hidden" accept=".json,.csv,text/csv,application/json">

<script src="engine.js"></script>
<script>
'use strict';

const STORE = 'caseload.workspace.v2';
let view = 'students';
let scheduleTab = 'week';
let showAllWeeks = false;
let altFor = null;
let studentQuery = '';
let csvImportMode = 'replace';
let caseloadDirty = false;
let undoSnapshot = null;

function blankWorkspace() {
  return {
    version: 2,
    settings: Object.assign({}, DEFAULT_SETTINGS),
    students: [],
    availability: [],
    grades: [],
    constraints: [],
    scheduleLog: [],
    lastRun: null,
  };
}

function sampleWorkspace() {
  const w = blankWorkspace();
  w.availability = [
    { day: 'Mon-Fri', start: '8:00 AM', end: '11:00 AM', pattern: '', notes: '' },
    { day: 'Mon, Wed', start: '12:30 PM', end: '3:00 PM', pattern: '', notes: '' },
    { day: 'Tue, Thu, Fri', start: '12:30 PM', end: '2:30 PM', pattern: '', notes: '' },
  ];
  w.grades = [
    { grade: '2', day: 'Mon-Fri', start: '11:30 AM', end: '12:15 PM', reason: 'Lunch' },
    { grade: '2', day: 'Tue', start: '1:00 PM', end: '1:45 PM', reason: 'Specials' },
    { grade: 'K', day: 'Mon, Wed', start: '9:00 AM', end: '9:30 AM', reason: 'Recess' },
    { grade: '3', day: 'Mon-Fri', start: '11:00 AM', end: '11:45 AM', reason: 'Lunch' },
  ];
  w.constraints = [
    { studentId: 'SMITHJ01', day: 'Tue', start: '10:00 AM', end: '10:30 AM', reason: 'OT' },
    { studentId: 'JONESM02', day: 'Mon-Fri', start: '8:00 AM', end: '8:30 AM', reason: 'Resource room' },
  ];
  w.students = [
    { id: 'SMITHJ01', firstName: 'John', lastName: 'Smith', grade: '2', serviceType: 'Individual', groupId: '', frequencyType: 'Weekly', minutesPerWeek: 60, preferredSessionLength: '', sessionsPerQuarter: '', quarterlySessionLength: '', notes: '', status: 'Active', teacher: 'Mrs. Lee — Rm 204', fixedDay: '', fixedStart: '' },
    { id: 'JONESM02', firstName: 'Mary', lastName: 'Jones', grade: '2', serviceType: 'Individual', groupId: '', frequencyType: 'Weekly', minutesPerWeek: 90, preferredSessionLength: '', sessionsPerQuarter: '', quarterlySessionLength: '', notes: '', status: 'Active', teacher: 'Mr. Kim — Rm 210', fixedDay: '', fixedStart: '' },
    { id: 'DOEA03', firstName: 'Alex', lastName: 'Doe', grade: 'K', serviceType: 'Individual', groupId: '', frequencyType: 'Quarterly', minutesPerWeek: '', preferredSessionLength: '', sessionsPerQuarter: 8, quarterlySessionLength: 30, notes: '', status: 'Active', teacher: 'Ms. Ray — Rm 101', fixedDay: '', fixedStart: '' },
    { id: 'LEEB04', firstName: 'Bri', lastName: 'Lee', grade: 'K', serviceType: 'Individual', groupId: '', frequencyType: 'Weekly', minutesPerWeek: 30, preferredSessionLength: '', sessionsPerQuarter: '', quarterlySessionLength: '', notes: '', status: 'Active', teacher: 'Ms. Ray — Rm 101', fixedDay: '', fixedStart: '' },
    { id: 'PARKC05', firstName: 'Cam', lastName: 'Park', grade: '3', serviceType: 'Group', groupId: 'G1', frequencyType: 'Weekly', minutesPerWeek: 45, preferredSessionLength: '', sessionsPerQuarter: '', quarterlySessionLength: '', notes: '', status: 'Active', teacher: 'Mr. Ade — Rm 305', fixedDay: '', fixedStart: '' },
    { id: 'RIOSD06', firstName: 'Dana', lastName: 'Rios', grade: '3', serviceType: 'Group', groupId: 'G1', frequencyType: 'Weekly', minutesPerWeek: 45, preferredSessionLength: '', sessionsPerQuarter: '', quarterlySessionLength: '', notes: '', status: 'Active', teacher: 'Mr. Ade — Rm 305', fixedDay: '', fixedStart: '' },
  ];
  return w;
}

let state = blankWorkspace();

function persist() {
  try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {}
}
function persistCaseload() {
  if ((state.scheduleLog || []).length) caseloadDirty = true;
  persist();
}
function hydrate() {
  try {
    const raw = localStorage.getItem(STORE);
    if (raw != null) state = Object.assign(blankWorkspace(), JSON.parse(raw));
  } catch (e) {}
}

function setStatus(msg, kind) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status' + (kind ? ' ' + kind : '');
}

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
}

function showView(id, tab) {
  view = id;
  if (tab) scheduleTab = tab;
  if (id !== 'schedule') altFor = null;
  document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('active', b.getAttribute('data-view') === id));
  render();
}

function engineInput() {
  return {
    settings: state.settings,
    students: state.students,
    availability: state.availability,
    grades: state.grades,
    constraints: state.constraints,
    scheduleLog: state.scheduleLog,
  };
}

function toTimeInput(display) {
  try {
    const m = timeStrToMinutes(display);
    return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
  } catch (e) { return ''; }
}
function fromTimeInput(value) {
  if (!value) return '';
  try { return minutesToTimeStr(timeStrToMinutes(value)); } catch (e) { return value; }
}

function uniqueValues(arr) {
  const set = {};
  arr.forEach(v => { const s = String(v || '').trim(); if (s) set[s] = true; });
  return Object.keys(set).sort();
}
function knownGrades() {
  return uniqueValues(state.grades.map(g => g.grade).concat(state.students.map(s => s.grade)));
}
function knownGroups() {
  return uniqueValues(state.students.map(s => s.groupId));
}
function studentLabel(id) {
  const s = state.students.find(x => x.id === id);
  return s ? (s.lastName + ', ' + s.firstName) : (id || 'Unknown');
}
function studentNeed(s) {
  if ((s.frequencyType || 'Weekly') === 'Quarterly') return (s.sessionsPerQuarter || '?') + ' × ' + (s.quarterlySessionLength || '?') + ' min / qtr';
  return (s.minutesPerWeek || 0) + ' min / week';
}
function coverageFor(id) {
  return reviewRows().find(r => r.id === id);
}
function blocksFor(id) {
  return state.constraints.filter(c => c.studentId === id);
}
function suggestId(s) {
  const last = String(s.lastName || 'X').replace(/[^A-Za-z]/g, '').toUpperCase().slice(0, 8) || 'X';
  const first = String(s.firstName || 'X').replace(/[^A-Za-z]/g, '').toUpperCase().slice(0, 1) || 'X';
  let n = 1, id;
  do { id = last + first + String(n).padStart(2, '0'); n += 1; }
  while (state.students.some(x => x.id === id));
  return id;
}

function staleBanner() {
  if (!caseloadDirty || !(state.scheduleLog || []).length) return '';
  return `<div class="stale no-print">Caseload changed since the last generate. <button class="primary" onclick="generateNow()">Generate again</button></div>`;
}

function snapshotSchedule() {
  return {
    scheduleLog: JSON.parse(JSON.stringify(state.scheduleLog || [])),
    lastRun: state.lastRun ? JSON.parse(JSON.stringify(state.lastRun)) : null,
    caseloadDirty: caseloadDirty,
  };
}

function generateNow() {
  const issues = validateCaseload(state);
  if (issues.length) {
    if (!confirm(issues.length + ' issue(s). First:\n' + issues[0] + '\n\nGenerate anyway?')) {
      setStatus(issues.length + ' issue(s): ' + issues[0], 'bad');
      return;
    }
  }
  const prev = snapshotSchedule();
  const result = runSchedulingEngine(engineInput());
  if (result.error) { setStatus(result.error, 'bad'); return; }
  undoSnapshot = prev;
  state.scheduleLog = result.logRows;
  state.lastRun = { at: new Date().toISOString(), sessionCount: result.sessionCount, unplaced: result.unscheduled.length, rescued: result.rescuedStudentCount, review: result.review };
  caseloadDirty = false;
  persist();
  setStatus('Scheduled ' + result.sessionCount + ' sessions · ' + result.unscheduled.length + ' unplaced', result.unscheduled.length ? 'bad' : 'ok');
  scheduleTab = 'week';
  showView('schedule');
}

function undoLastGenerate() {
  if (!undoSnapshot) return;
  state.scheduleLog = undoSnapshot.scheduleLog;
  state.lastRun = undoSnapshot.lastRun;
  caseloadDirty = undoSnapshot.caseloadDirty;
  undoSnapshot = null;
  persist();
  setStatus('Restored the previous schedule.', 'ok');
  render();
}

function loadSampleAndGenerate() {
  state = sampleWorkspace();
  caseloadDirty = false;
  persist();
  generateNow();
}

function setupProgress() {
  return {
    hours: (state.availability || []).length > 0,
    grades: (state.grades || []).length > 0,
    students: (state.students || []).length > 0,
  };
}

function needsOnboarding() {
  const p = setupProgress();
  return !p.hours || !p.grades || !p.students;
}

function wizardHtml() {
  if (!needsOnboarding()) return '';
  const p = setupProgress();
  const item = (done, todo, doneText) => done
    ? '<li class="done">' + doneText + '</li>'
    : '<li>' + todo + '</li>';
  return `<div class="wizard no-print">
    <h3>Get a schedule in three steps</h3>
    <p class="meta">Hours, then grade lunches, then students. Or load the sample caseload to see a finished week.</p>
    <ol>
      ${item(p.hours, '<a href="#" onclick="showView(\'setup\');return false">Add your working hours</a>', 'Hours added.')}
      ${item(p.grades, '<a href="#" onclick="showView(\'setup\');return false">Add lunch / recess for each grade</a>', 'Grade blocks added.')}
      ${item(p.students, '<a href="#" onclick="showView(\'students\');return false">Add your first student</a>', 'Students added.')}
    </ol>
    <div class="card-actions">
      <button type="button" class="primary" onclick="loadSampleAndGenerate()">Load sample caseload</button>
    </div>
  </div>`;
}

function validateNow() {
  const issues = validateCaseload(state);
  if (!issues.length) setStatus('Looks ready to generate.', 'ok');
  else setStatus(issues.length + ' issue(s): ' + issues[0], 'bad');
  render();
}

function downloadText(name, text, mime) {
  const blob = new Blob([text], { type: mime || 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 500);
}

function exportWorkspace() {
  downloadText('caseload-workspace.json', JSON.stringify(state, null, 2), 'application/json');
  setStatus('Saved workspace JSON.', 'ok');
}

function exportCsv(kind) {
  const map = {
    students: state.students,
    availability: state.availability,
    grades: state.grades,
    constraints: state.constraints,
    schedule: state.scheduleLog,
  };
  downloadText(kind + '.csv', objectsToCsv(map[kind] || [], CSV_SCHEMAS[kind]), 'text/csv');
  setStatus('Exported ' + kind + '.csv', 'ok');
}

function mergeBy(existing, incoming, keyFn) {
  const map = {};
  existing.forEach(r => { map[keyFn(r)] = r; });
  incoming.forEach(r => { map[keyFn(r)] = Object.assign({}, map[keyFn(r)] || {}, r); });
  return Object.values(map);
}

function importText(name, text) {
  if (/\.json$/i.test(name) || text.trim().startsWith('{')) {
    const data = JSON.parse(text);
    state = Object.assign(blankWorkspace(), data);
    caseloadDirty = false;
    persist();
    setStatus('Opened workspace.', 'ok');
    render();
    return;
  }
  const rows = csvToObjects(text);
  const headers = rows[0] ? Object.keys(rows[0]) : [];
  const kind = detectCsvKind(headers);
  const merge = csvImportMode === 'merge';
  if (kind === 'students') {
    const incoming = rows.map(normalizeImportedStudent);
    if (!merge && state.students.length && !confirm('Replace all ' + state.students.length + ' students with this CSV?')) return;
    state.students = merge ? mergeBy(state.students, incoming, r => r.id) : incoming;
  } else if (kind === 'availability') {
    const incoming = rows.map(r => ({ day: r.day || r.Day, start: r.start || r.Start, end: r.end || r.End, pattern: r.pattern || r.Pattern || '', notes: r.notes || r.Notes || '' }));
    if (!merge && state.availability.length && !confirm('Replace all hours with this CSV?')) return;
    state.availability = merge ? mergeBy(state.availability, incoming, r => [r.day, r.start, r.end, r.pattern].join('|')) : incoming;
  } else if (kind === 'grades') {
    const incoming = rows.map(r => ({ grade: r.grade || r.Grade, day: r.day || r.Day, start: r.start || r.Start, end: r.end || r.End, reason: r.reason || r.Reason || '' }));
    if (!merge && state.grades.length && !confirm('Replace all grade blocks with this CSV?')) return;
    state.grades = merge ? mergeBy(state.grades, incoming, r => [r.grade, r.day, r.start, r.end].join('|')) : incoming;
  } else if (kind === 'constraints') {
    const incoming = rows.map(r => ({ studentId: r.studentId || r['Student ID'], day: r.day || r.Day, start: r.start || r.Start, end: r.end || r.End, reason: r.reason || r.Reason || '' }));
    if (!merge && state.constraints.length && !confirm('Replace all student blocks with this CSV?')) return;
    state.constraints = merge ? mergeBy(state.constraints, incoming, r => [r.studentId, r.day, r.start, r.end].join('|')) : incoming;
  } else if (kind === 'schedule') {
    state.scheduleLog = rows;
  } else { setStatus('Could not detect CSV type from headers.', 'bad'); return; }
  persistCaseload();
  setStatus((merge && kind !== 'schedule' ? 'Merged ' : 'Imported ') + kind + ' (' + rows.length + ' rows).', 'ok');
  render();
}

function renderWeekGrid(cal, week) {
  const weekLabel = cal.hasSpecificWeeks ? ('Week ' + week) : 'Every Week';
  const inc = cal.inc, start = cal.minStart, rows = cal.rowsCount;
  const cells = {};
  const selected = altFor != null ? state.scheduleLog[altFor] : null;
  let selectedStart = null;
  if (selected) { try { selectedStart = timeStrToMinutes(selected.start); } catch (e) {} }

  DAYS.forEach(d => { cells[d] = Array.from({ length: rows }, () => null); });
  cal.entries.filter(e => e.weekLabel === 'Every Week' || e.weekLabel === weekLabel).forEach(e => {
    const r0 = Math.max(0, Math.round((e.start - start) / inc));
    const r1 = Math.min(rows, Math.max(r0 + 1, Math.round((e.end - start) / inc)));
    const color = cal.gradeColors[e.grade] || { bg: '#444', text: '#fff' };
    const text = e.names.join(' + ') + '\\n' + minutesToTimeStr(e.start) + '–' + minutesToTimeStr(e.end);
    if (cells[e.day]) cells[e.day][r0] = { span: Math.max(1, r1 - r0), text, color, day: e.day, start: e.start, studentId: (e.studentIds && e.studentIds[0]) || '' };
    for (let r = r0 + 1; r < r1; r++) if (cells[e.day]) cells[e.day][r] = 'skip';
  });
  let html = '<div class="cal-grid">';
  html += '<div class="cal-head">Time</div>' + DAYS.map(d => '<div class="cal-head">' + d + '</div>').join('');
  for (let r = 0; r < rows; r++) {
    html += '<div>' + esc(minutesToTimeStr(start + r * inc)) + '</div>';
    DAYS.forEach(d => {
      const c = cells[d][r];
      if (c === 'skip') return;
      if (!c) { html += '<div></div>'; return; }
      html += `<div style="grid-row: span ${c.span}"><div class="sess${selected && c.day === selected.day && c.start === selectedStart && String(c.studentId) === String(selected.studentId) ? ' on' : ''}" title="Open session tools" onclick="openCalendarSession('${esc(c.day)}',${c.start},'${esc(c.studentId)}')" style="background:${c.color.bg};color:${c.color.text}">${esc(c.text)}</div></div>`;
    });
  }
  return html + '</div>';
}

function openCalendarSession(day, startMins, studentId) {
  const i = (state.scheduleLog || []).findIndex(r => {
    try { return r.day === day && timeStrToMinutes(r.start) === startMins && String(r.studentId) === String(studentId); }
    catch (e) { return false; }
  });
  if (i < 0) { setStatus('Could not find that session.', 'bad'); return; }
  altFor = i;
  scheduleTab = 'week';
  showView('schedule');
}

function renderReviewBody() {
  const rows = reviewRows();
  if (!rows.length) return '<p class="lede">Generate a schedule to see required vs placed minutes.</p>';

function toggleLock(i) {
  const row = state.scheduleLog[i];
  if (!row) return;

  row.locked = on ? '' : 'Yes';

  render();

function clearScheduleKeepLocks() {
  state.scheduleLog = (state.scheduleLog || []).filter(r => String(r.locked).toLowerCase() === 'yes');

}

function openAlts(i) { altFor = i; scheduleTab = 'sessions'; render(); }

function renderAlts() {
  const row = state.scheduleLog[altFor];
  const found = findAlternativeSlots(engineInput(), row);
  if (found.error) return `<div class="card">${esc(found.error)}</div>`;
  let html = `<div class="card"><h3>Other times for ${esc(row.name)}</h3><p class="meta">Up to 24 slots that fit current locks and blackouts. Click to move this session (group members move together if they share a group id).</p><div class="chip-row">`;
  found.candidates.forEach((c, n) => {
    html += `<button class="chip" onclick="applyAlt(${n})">${esc(c.day)} ${esc(minutesToTimeStr(c.start))}–${esc(minutesToTimeStr(c.end))}${c.week && c.week !== ALL_WEEKS_KEY && c.week !== 'ALL' ? ' W' + c.week : ''}</button>`;
  });
  if (!found.candidates.length) html += '<span class="meta">None available.</span>';
  return html + '</div><button class="ghost" onclick="altFor=null;render()">Close</button></div>';
}

function applyAlt(n) {
  const row = state.scheduleLog[altFor];
  const found = findAlternativeSlots(engineInput(), row);
  const c = found.candidates[n];
  if (!c) return;
  const dur = timeStrToMinutes(row.end) - timeStrToMinutes(row.start);
  const gid = row.groupId;
  state.scheduleLog.forEach(r => {
    const same = r === row || (gid && r.groupId === gid && r.week === row.week && r.day === row.day && r.start === row.start);
    if (!same) return;
    r.day = c.day;
    r.start = minutesToTimeStr(c.start);
    r.end = minutesToTimeStr(c.start + dur);
    if (c.week && c.week !== ALL_WEEKS_KEY && c.week !== 'ALL') r.week = 'Week ' + c.week;
  });
  persist();
  setStatus('Moved session.', 'ok');
  altFor = null;
  render();
}

function renderOpenBody() {
  const data = computeOpenSlots(engineInput());
  if (data.error) return `<p class="lede">${esc(data.error)}</p>`;

  html += '<div class="open-grids">';
  data.blocks.forEach(b => {
    html += `<div class="card"><h3>Grade ${esc(b.grade)}${data.hasAlternating ? ' · pattern ' + b.pattern : ''} <span class="meta">${b.openMinutes} open min / week</span></h3>

    b.cells.forEach(row => {

        const cell = row.days[d];
        return `<td class="${cell.kind}">${esc(cell.label)}</td>`;

    });
    html += '</tbody></table></div>';
  });
  html += '</div>';
  return html;
}

function removeStudent(idx) {
  const s = state.students[idx];
  if (!s) return;
  if (!confirm('Remove ' + s.firstName + ' ' + s.lastName + '? Their unavailable times will be deleted too.')) return;
  const id = s.id;
  state.students.splice(idx, 1);
  state.constraints = state.constraints.filter(c => c.studentId !== id);
  persistCaseload();
  render();
}

function duplicateStudent(idx) {
  const src = state.students[idx];
  if (!src) return;
  const copy = Object.assign({}, src, { id: suggestId(src) });
  state.students.splice(idx + 1, 0, copy);
  blocksFor(src.id).forEach(b => state.constraints.push(Object.assign({}, b, { studentId: copy.id })));
  persistCaseload();
  render();
  openStudentForm(idx + 1);
}

    <div class="row" style="margin-top:12px">
      <button class="primary" id="f-save">Save student</button>
      <button id="f-cancel">Close</button>
    </div>
  </div>`;
  document.body.appendChild(wrap);
  wrap.querySelector('#f-status').value = s.status || 'Active';
  wrap.querySelector('#f-service').value = s.serviceType || 'Individual';
  wrap.querySelector('#f-freq').value = s.frequencyType || 'Weekly';
  wrap.querySelector('#f-fd').value = s.fixedDay || '';
  const sync = () => {
    const service = wrap.querySelector('#f-service').value;
    const freq = wrap.querySelector('#f-freq').value;
    wrap.querySelector('#weekly-fields').classList.toggle('hidden', freq !== 'Weekly');
    wrap.querySelector('#quarterly-fields').classList.toggle('hidden', freq !== 'Quarterly');
    wrap.querySelector('#group-fields').classList.toggle('hidden', service !== 'Group');
  };
  wrap.querySelector('#f-service').onchange = sync;
  wrap.querySelector('#f-freq').onchange = sync;
  wrap.querySelector('#f-grade').onchange = () => {
    const custom = wrap.querySelector('#f-grade-new');
    const isOther = wrap.querySelector('#f-grade').value === '__new__';
    custom.classList.toggle('hidden', !isOther);
    if (isOther) custom.focus();
  };
  wrap.querySelector('#f-gid-pick').onchange = () => {
    const custom = wrap.querySelector('#f-gid');
    const isNewGroup = wrap.querySelector('#f-gid-pick').value === '__new__';
    custom.classList.toggle('hidden', !isNewGroup);
    if (isNewGroup) { custom.value = ''; custom.focus(); }
    else custom.value = wrap.querySelector('#f-gid-pick').value;
  };
  sync();
  wrap.addEventListener('click', (e) => { if (e.target === wrap) wrap.remove(); });
  wrap.querySelector('#f-cancel').onclick = () => wrap.remove();
  const addBtn = wrap.querySelector('#f-add-block');
  if (addBtn) addBtn.onclick = () => addBlockFor(s.id);
  wrap.querySelector('#f-save').onclick = () => {
    const gradePick = wrap.querySelector('#f-grade').value;
    const groupPick = wrap.querySelector('#f-gid-pick').value;
    const gidCustom = wrap.querySelector('#f-gid');
    const next = {
      id: wrap.querySelector('#f-id').value.trim(),
      firstName: wrap.querySelector('#f-first').value.trim(),
      lastName: wrap.querySelector('#f-last').value.trim(),
      grade: gradePick === '__new__' ? wrap.querySelector('#f-grade-new').value.trim() : gradePick,
      teacher: wrap.querySelector('#f-teacher').value.trim(),
      serviceType: wrap.querySelector('#f-service').value,
      groupId: wrap.querySelector('#f-service').value === 'Group'
        ? (groupPick === '__new__' || !gidCustom.classList.contains('hidden') ? gidCustom.value.trim() : groupPick)
        : '',
      frequencyType: wrap.querySelector('#f-freq').value,
      minutesPerWeek: wrap.querySelector('#f-min').value,
      preferredSessionLength: wrap.querySelector('#f-pref').value,
      sessionsPerQuarter: wrap.querySelector('#f-sq').value,
      quarterlySessionLength: wrap.querySelector('#f-ql').value,
      status: wrap.querySelector('#f-status').value,
      notes: wrap.querySelector('#f-notes').value,
      fixedDay: wrap.querySelector('#f-fd').value,
      fixedStart: fromTimeInput(wrap.querySelector('#f-fs').value),
    };
    if (!next.firstName || !next.lastName) { alert('First and last name are required.'); return; }
    if (!next.id) next.id = suggestId(next);
    if (state.students.some((row, i) => row.id === next.id && i !== idx)) {
      alert('That student ID is already in use.');
      return;
    }
    if (idx == null) state.students.push(next);
    else {
      const oldId = state.students[idx].id;
      state.students[idx] = next;
      if (oldId !== next.id) state.constraints.forEach(c => { if (c.studentId === oldId) c.studentId = next.id; });
    }
    persistCaseload();
    wrap.remove();
    render();
  };
}

function blockEditorHtml(studentId) {
  const rows = state.constraints.map((c, i) => ({ c, i })).filter(x => x.c.studentId === studentId);
  if (!rows.length) return '<p class="meta">None yet. Grade lunch and specials already apply automatically.</p>';
  return rows.map(({ c, i }) => `<div class="block-item">
    <div class="form-grid">
      <div><label>Reason</label><input value="${esc(c.reason)}" onchange="state.constraints[${i}].reason=this.value;persistCaseload()"></div>
      <div></div>
      <div><label>Start</label><input type="time" step="300" value="${esc(toTimeInput(c.start))}" onchange="state.constraints[${i}].start=fromTimeInput(this.value);persistCaseload()"></div>
      <div><label>End</label><input type="time" step="300" value="${esc(toTimeInput(c.end))}" onchange="state.constraints[${i}].end=fromTimeInput(this.value);persistCaseload()"></div>
    </div>
    <label>Days</label>
    <div class="chip-row">${dayChips(c.day, 'constraints', i)}</div>
    <button class="ghost danger" onclick="removeBlock(${i}, '${esc(studentId)}')">Remove block</button>
  </div>`).join('');
}

function refreshBlockEditor(studentId) {
  const el = document.getElementById('block-editor');
  if (el) el.innerHTML = blockEditorHtml(studentId);
}

function addBlockFor(studentId) {
  state.constraints.push({ studentId: studentId, day: 'Mon', start: '9:00 AM', end: '9:30 AM', reason: 'OT' });
  persistCaseload();
  refreshBlockEditor(studentId);
}

function removeBlock(i, studentId) {
  state.constraints.splice(i, 1);
  persistCaseload();
  refreshBlockEditor(studentId);
}

function dayChips(selected, kind, i) {
  const set = new Set(parseDayList(selected || ''));
  return DAYS.map(d => `<button type="button" class="chip ${set.has(d) ? 'on' : ''}" data-day="${d}" onclick="toggleDay(this,'${kind}',${i})">${d}</button>`).join('');
}

function toggleDay(btn, kind, i) {
  btn.classList.toggle('on');
  const days = Array.from(btn.parentElement.querySelectorAll('.chip.on')).map(b => b.dataset.day);
  const v = days.join(', ');
  if (kind === 'availability') state.availability[i].day = v;
  if (kind === 'grades') state.grades[i].day = v;
  if (kind === 'constraints') state.constraints[i].day = v;
  persistCaseload();
}

function addWindow(kind) {
  if (kind === 'availability') state.availability.push({ day: 'Mon-Fri', start: '8:00 AM', end: '3:00 PM', pattern: '', notes: '' });
  if (kind === 'grades') state.grades.push({ grade: knownGrades()[0] || '', day: 'Mon-Fri', start: '11:30 AM', end: '12:15 PM', reason: 'Lunch' });
  persistCaseload(); render();
}

function copyWindow(kind, i) {
  const src = kind === 'availability' ? state.availability[i] : state.grades[i];
  if (!src) return;
  (kind === 'availability' ? state.availability : state.grades).splice(i + 1, 0, Object.assign({}, src));
  persistCaseload(); render();
}

function addLunchBlock() {
  state.grades.push({ grade: knownGrades()[0] || '', day: 'Mon-Fri', start: '11:30 AM', end: '12:15 PM', reason: 'Lunch' });
  persistCaseload(); render();
}

function renderSetup() {
  return `<h1>Hours &amp; grades</h1>
    <p class="lede">Your working windows, plus grade-level lunch/recess/specials. Student-specific OT or resource times live on the student card.</p>
    ${wizardHtml()}
    ${staleBanner()}
    <div class="setup-grid">
      <div class="setup-col">
        <h2>My hours</h2>
        <p class="meta">When you can see students. Leave pattern blank for every week; A/B for alternating.</p>
        <div class="row"><button class="primary" onclick="addWindow('availability')">Add window</button><button onclick="exportCsv('availability')">CSV</button></div>
        ${`<div class="stack">` + (state.availability.map((w, i) => `<div class="card"><div class="form-grid">
          <div><label>Days</label><div class="chip-row">${dayChips(w.day, 'availability', i)}</div></div>
          <div><label>Pattern</label><select onchange="state.availability[${i}].pattern=this.value;persistCaseload()"><option value="" ${!w.pattern?'selected':''}>Every week</option><option ${w.pattern==='A'?'selected':''}>A</option><option ${w.pattern==='B'?'selected':''}>B</option></select></div>
          <div><label>Start</label><input type="time" step="300" value="${esc(toTimeInput(w.start))}" onchange="state.availability[${i}].start=fromTimeInput(this.value);persistCaseload()"></div>
          <div><label>End</label><input type="time" step="300" value="${esc(toTimeInput(w.end))}" onchange="state.availability[${i}].end=fromTimeInput(this.value);persistCaseload()"></div>
        </div>
        <div class="field"><label>Notes</label><input value="${esc(w.notes)}" onchange="state.availability[${i}].notes=this.value;persistCaseload()"></div>
        <div class="card-actions">
          <button onclick="copyWindow('availability',${i})">Duplicate</button>
          <button class="ghost danger" onclick="state.availability.splice(${i},1);persistCaseload();render()">Remove</button>
        </div></div>`).join('') || '<p class="meta">No hours yet — add a window for the days you work.</p>') + `</div>`}
      </div>
      <div class="setup-col">
        <h2>Grade blocks</h2>
        <p class="meta">Inherited by every student in that grade. Use a student card for one-off conflicts.</p>
        <div class="row"><button class="primary" onclick="addWindow('grades')">Add block</button><button onclick="addLunchBlock()">Add lunch</button><button onclick="exportCsv('grades')">CSV</button></div>
        ${`<div class="stack">` + (state.grades.map((g, i) => `<div class="card"><div class="form-grid">
          <div><label>Grade</label><input list="grade-list" value="${esc(g.grade)}" onchange="state.grades[${i}].grade=this.value;persistCaseload()"></div>
          <div><label>Reason</label><input value="${esc(g.reason)}" onchange="state.grades[${i}].reason=this.value;persistCaseload()"></div>
          <div><label>Start</label><input type="time" step="300" value="${esc(toTimeInput(g.start))}" onchange="state.grades[${i}].start=fromTimeInput(this.value);persistCaseload()"></div>
          <div><label>End</label><input type="time" step="300" value="${esc(toTimeInput(g.end))}" onchange="state.grades[${i}].end=fromTimeInput(this.value);persistCaseload()"></div>
        </div><div class="field"><label>Days</label><div class="chip-row">${dayChips(g.day, 'grades', i)}</div></div>
        <div class="card-actions">
          <button onclick="copyWindow('grades',${i})">Duplicate</button>
          <button class="ghost danger" onclick="state.grades.splice(${i},1);persistCaseload();render()">Remove</button>
        </div></div>`).join('') || '<p class="meta">No grade blocks yet — start with lunch for each grade you serve.</p>') + `</div>`}
        <datalist id="grade-list">${knownGrades().map(g => `<option value="${esc(g)}">`).join('')}</datalist>
      </div>
    </div>`;
}

function renderFiles() {
  return `<h1>Import / export</h1>
    <p class="lede">The live workspace auto-saves in this browser. JSON is the full file (settings + caseload + schedule). CSV is one table at a time.</p>
    <div class="drop" id="drop">Drop a .json or .csv here, or <button onclick="pickFile()">choose a file</button></div>
    <div class="row">
      <label style="margin:0;font-weight:600">CSV import</label>
      <select style="width:auto" onchange="csvImportMode=this.value">
        <option value="replace" ${csvImportMode==='replace'?'selected':''}>Replace this table</option>
        <option value="merge" ${csvImportMode==='merge'?'selected':''}>Merge (match students by ID)</option>
      </select>
    </div>
    <div class="row">
      <button class="primary" onclick="exportWorkspace()">Download workspace.json</button>
      <button onclick="exportCsv('students')">students.csv</button>
      <button onclick="exportCsv('availability')">hours.csv</button>
      <button onclick="exportCsv('grades')">grades.csv</button>
      <button onclick="exportCsv('constraints')">blocks.csv</button>
      <button onclick="exportCsv('schedule')">schedule.csv</button>
    </div>
    <div class="row">
      <button onclick="state=sampleWorkspace();caseloadDirty=false;persist();render();setStatus('Sample caseload loaded.','ok')">Reset to sample</button>
      <button onclick="if(confirm('Clear the whole workspace?')){state=blankWorkspace();caseloadDirty=false;persist();render();setStatus('Cleared.','ok')}">Start empty</button>
    </div>
    <div class="card"><h3>CSV headers</h3>
      <p class="meta"><b>students:</b> ${CSV_SCHEMAS.students.join(', ')}</p>
      <p class="meta"><b>availability:</b> ${CSV_SCHEMAS.availability.join(', ')}</p>
      <p class="meta"><b>grades:</b> ${CSV_SCHEMAS.grades.join(', ')}</p>
      <p class="meta"><b>constraints:</b> ${CSV_SCHEMAS.constraints.join(', ')}</p>
      <p class="meta"><b>schedule:</b> ${CSV_SCHEMAS.schedule.join(', ')}</p>
    </div>`;
}

function renderSettings() {
  const s = state.settings;
  const num = (key, label) => `<div><label>${label}</label><input type="number" value="${esc(s[key])}" onchange="state.settings.${key}=Number(this.value)||this.value;persist()"></div>`;
  return `<h1>Settings</h1>
    <p class="lede">Everyday knobs. Placement extras live under Advanced — they apply on the next generate.</p>
    <div class="card form-grid">
      ${num('minSessionLength','Min session (min)')}
      ${num('maxSessionLength','Max session (min)')}
      ${num('weeksPerQuarter','Weeks per quarter')}
      <div><label>Starting week pattern</label><select onchange="state.settings.startingWeekPattern=this.value;persist()"><option ${s.startingWeekPattern==='A'?'selected':''}>A</option><option ${s.startingWeekPattern==='B'?'selected':''}>B</option></select></div>
      <div><label>Front-load first sessions (weeks 1–2)</label><select onchange="state.settings.frontLoadFirstSessions=this.value==='true';persist()"><option value="true" ${s.frontLoadFirstSessions?'selected':''}>Yes</option><option value="false" ${!s.frontLoadFirstSessions?'selected':''}>No</option></select></div>
      <div><label>Show teacher on outputs</label><select onchange="state.settings.showTeacherInfo=this.value==='true';persist()"><option value="true" ${s.showTeacherInfo?'selected':''}>Yes</option><option value="false" ${!s.showTeacherInfo?'selected':''}>No</option></select></div>
    </div>
    <details class="adv"><summary>Advanced</summary>
      <div class="card form-grid" style="margin-top:10px">
        ${num('slotIncrement','Slot increment (min)')}
        ${num('groupRescueExtraMinutes','Group rescue extra minutes')}
        ${num('maxGroupSize','Max auto-group size')}
        <div><label>Prefer consistent weekly pattern</label><select onchange="state.settings.preferConsistentPattern=this.value==='true';persist()"><option value="true" ${s.preferConsistentPattern?'selected':''}>Yes</option><option value="false" ${!s.preferConsistentPattern?'selected':''}>No</option></select></div>
      </div>
    </details>`;
}

function render() {
  const main = document.getElementById('main');
  const map = { students: renderStudents, setup: renderSetup, schedule: renderSchedule, files: renderFiles, settings: renderSettings };
  main.innerHTML = (map[view] || renderStudents)();
  const drop = document.getElementById('drop');
  if (drop) {
    drop.ondragover = (e) => { e.preventDefault(); drop.classList.add('hot'); };
    drop.ondragleave = () => drop.classList.remove('hot');
    drop.ondrop = (e) => {
      e.preventDefault(); drop.classList.remove('hot');
      const f = e.dataTransfer.files[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = () => importText(f.name, reader.result);
      reader.readAsText(f);
    };
  }
  const undoBtn = document.getElementById('undo-btn');
  if (undoBtn) undoBtn.classList.toggle('hidden', !undoSnapshot);
  const pop = document.getElementById('session-popover');
  if (pop) pop.scrollIntoView({ block: 'nearest' });
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && altFor != null) { altFor = null; render(); }
});
window.addEventListener('afterprint', () => {
  if (!document.body.classList.contains('print-week')) return;
  document.body.classList.remove('print-week');
  render();
});

hydrate();
render();

</script>
</body>
</html>

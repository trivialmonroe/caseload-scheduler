<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Caseload — Scheduler</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1c2b24;
      --muted: #5c6f66;
      --line: #d5e0da;
      --paper: #f2f5f0;
      --paper-2: #e8eef2;
      --card: #ffffff;
      --accent: #0f766e;
      --accent-soft: #e6f5f2;
      --accent-mid: #14b8a6;
      --clay: #7c2d12;
      --clay-soft: #f3ebe6;
      --ok: #166534;
      --ok-soft: #e8f6ec;
      --bad: #b91c1c;
      --bad-soft: #fdecec;
      --open: #d8f3e4;
      --blocked: #f5d5d5;
      --off: #e4ebe7;
      --radius: 10px;
      --radius-sm: 6px;
      --shadow: 0 1px 2px rgba(28,43,36,.04), 0 10px 28px rgba(28,43,36,.06);
      --ease: 160ms ease;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: Outfit, "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(1200px 600px at 12% -10%, rgba(20,184,166,.10), transparent 55%),
        linear-gradient(165deg, var(--paper) 0%, var(--paper-2) 100%);
      color: var(--ink);
      display: grid;
      grid-template-columns: 228px 1fr;
      grid-template-rows: 58px 1fr;
      grid-template-areas: "top top" "nav main";
    }
    .top {
      grid-area: top;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 18px;
      background: rgba(255,255,255,.88);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }
    .brand {
      font-weight: 700; letter-spacing: -.03em; font-size: 1.15rem;
      display: flex; align-items: baseline; gap: 7px;
    }
    .brand span {
      color: var(--accent);
      font-weight: 600;
      font-size: .78rem;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .top .grow { flex: 1; }
    .status {
      font-size: 13px; color: var(--muted); max-width: 42%;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .status.ok { color: var(--ok); }
    .status.bad { color: var(--bad); }
    button, .btn {
      font: inherit; cursor: pointer; border-radius: var(--radius-sm);
      border: 1px solid var(--line); background: var(--card); padding: 7px 12px;
      color: var(--ink); transition: background var(--ease), border-color var(--ease), color var(--ease), transform var(--ease);
    }
    button:hover, .btn:hover { background: var(--accent-soft); border-color: #b7d5ce; }
    button.primary {
      background: var(--accent); color: #fff; border-color: var(--accent);
      font-weight: 600; box-shadow: 0 1px 0 rgba(255,255,255,.18) inset;
    }
    button.primary:hover { background: #0d9488; border-color: #0d9488; }
    button.ghost { border-color: transparent; background: transparent; color: var(--muted); }
    button.ghost:hover { color: var(--ink); background: var(--accent-soft); }
    aside {
      grid-area: nav;
      background: rgba(255,255,255,.72);
      border-right: 1px solid var(--line);
      padding: 14px 10px;
      display: flex; flex-direction: column; gap: 2px;
    }
    aside .sec {
      font-size: 10px; text-transform: uppercase; letter-spacing: .1em;
      color: var(--muted); padding: 14px 12px 6px; font-weight: 600;
    }
    aside button.nav {
      width: 100%; text-align: left; border: none; background: transparent;
      padding: 9px 12px; border-radius: var(--radius-sm); color: var(--ink);
      position: relative; transition: background var(--ease), color var(--ease);
    }
    aside button.nav:hover { background: rgba(15,118,110,.06); }
    aside button.nav.active {
      background: var(--accent-soft); color: var(--accent); font-weight: 600;
    }
    aside button.nav.active::before {
      content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px;
      border-radius: 0 3px 3px 0; background: var(--accent);
    }
    main { grid-area: main; overflow: auto; padding: 22px 26px 52px; }
    h1 { font-size: 1.45rem; margin: 0 0 4px; letter-spacing: -.03em; font-weight: 700; }
    h2 { letter-spacing: -.02em; }
    .lede { color: var(--muted); margin: 0 0 18px; line-height: 1.45; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 16px; box-shadow: var(--shadow);
    }
    .card h3 { margin: 0 0 8px; font-size: 1rem; letter-spacing: -.01em; }
    .meta { font-size: 12px; color: var(--muted); line-height: 1.45; }
    .stack { display: flex; flex-direction: column; gap: 14px; }
    .pill {
      display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: var(--radius-sm);
      background: var(--off); margin-right: 4px; font-weight: 500;
    }
    .pill.teal { background: var(--accent-soft); color: #115e59; }
    .pill.warn { background: var(--clay-soft); color: var(--clay); }
    .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
    .stat {
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 12px 14px; box-shadow: var(--shadow);
    }
    .stat b { display: block; font-size: 1.45rem; letter-spacing: -.03em; color: var(--accent); font-variant-numeric: tabular-nums; }
    .stat span { color: var(--muted); font-size: 12px; }
    table {
      width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px;
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden;
    }
    th, td { border-bottom: 1px solid var(--line); padding: 9px 12px; text-align: left; vertical-align: top; }
    th {
      font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted);
      background: #f5f8f6; font-weight: 600;
    }
    tr:last-child td { border-bottom: none; }
    tr.under td { background: var(--bad-soft); }
    tr.met td { background: var(--ok-soft); }
    tr.auto td { background: var(--accent-soft); }
    .chip-row { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 4px; }
    .chip {
      border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 5px 11px;
      font-size: 12px; background: #fff; cursor: pointer; transition: background var(--ease), border-color var(--ease);
    }
    .chip:hover { border-color: #b7d5ce; background: var(--accent-soft); }
    .chip.on { background: var(--accent); color: #fff; border-color: var(--accent); }
    input, select, textarea {
      font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius-sm);
      width: 100%; background: #fff; transition: border-color var(--ease), box-shadow var(--ease);
    }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: var(--accent-mid);
      box-shadow: 0 0 0 3px rgba(20,184,166,.18);
    }
    label { font-size: 12px; font-weight: 600; display: block; margin: 0 0 6px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; align-items: start; }
    .modal-bg {
      position: fixed; inset: 0; background: rgba(28,43,36,.42); display: flex;
      align-items: center; justify-content: center; z-index: 50;
      animation: fadeIn 160ms ease;
    }
    .modal {
      background: #fff; border-radius: 14px; width: min(560px, 92vw); max-height: 90vh;
      overflow: auto; padding: 20px; box-shadow: var(--shadow); border: 1px solid var(--line);
      animation: riseIn 180ms ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes riseIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .cal { overflow-x: auto; border-radius: var(--radius); }
    .cal-grid {
      display: grid; grid-template-columns: 64px repeat(5, 1fr); min-width: 720px;
      border: 1px solid var(--line); background: #fff; border-radius: var(--radius); overflow: hidden;
    }
    .cal-grid > div { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); min-height: 28px; font-size: 11px; padding: 2px; }
    .cal-head {
      background: linear-gradient(180deg, #1a3d36 0%, #16352f 100%);
      color: #ecfdf8; text-align: center; padding: 9px !important; font-weight: 600; letter-spacing: .02em;
    }
    .sess {
      border-radius: var(--radius-sm); padding: 4px 6px; color: #fff; font-size: 11px;
      line-height: 1.25; height: 100%; box-shadow: 0 1px 0 rgba(0,0,0,.08);
    }
    .heat td.open { background: var(--open); }
    .heat td.blocked { background: var(--blocked); font-size: 10px; }
    .heat td.off { background: var(--off); }
    .drop {
      border: 1.5px dashed #b7d5ce; border-radius: var(--radius); padding: 18px; text-align: center;
      color: var(--muted); margin-bottom: 12px; background: rgba(255,255,255,.7);
      transition: border-color var(--ease), background var(--ease);
    }
    .drop.hot { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
    .hidden { display: none !important; }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 14px; }
    .tabs button.on { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
    .stale {
      background: var(--clay-soft); border: 1px solid #e4cfc4; color: var(--clay);
      padding: 10px 12px; border-radius: var(--radius); margin-bottom: 16px; font-size: 13px;
    }
    .setup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: start; }
    .setup-col { min-width: 0; display: flex; flex-direction: column; gap: 16px; }
    .setup-col h2 { margin: 0; font-size: 1.12rem; letter-spacing: -.02em; }
    .setup-col > .meta { margin: 0; }
    .setup-col > .row { margin: 0; }
    @media (min-width: 981px) {
      .setup-col + .setup-col { border-left: 1px solid var(--line); padding-left: 28px; }
    }
    .wizard {
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 16px 18px; margin-bottom: 18px; box-shadow: var(--shadow);
      border-left: 3px solid var(--accent);
    }
    .wizard h3 { margin: 0 0 6px; font-size: 1rem; }
    .wizard .meta { margin: 0 0 4px; }
    .wizard ol { margin: 10px 0 0; padding-left: 20px; }
    .wizard li { margin: 8px 0; }
    .wizard li.done { color: var(--ok); }
    .wizard .card-actions { margin-top: 12px; }
    .popover {
      position: relative; z-index: 40; background: #fff; border: 1px solid var(--line);
      border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); margin: 0 0 18px; max-width: 720px;
    }
    .popover h3 { margin: 0 0 6px; }
    .card-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    .field { margin-top: 12px; }
    .chip-row { gap: 8px; }
    .popover .chip-row { gap: 8px; margin-top: 8px; }
    .week-cals, .open-grids { display: flex; flex-direction: column; gap: 20px; }
    .card.cal h3 { margin: 0 0 12px; }
    .sess.on { outline: 2px solid var(--accent); outline-offset: 1px; }
    .mob-nav { display: none; }
    .card.student { cursor: pointer; transition: border-color var(--ease), transform var(--ease); }
    .card.student:hover { border-color: #b7d5ce; transform: translateY(-1px); }
    .modal { width: min(680px, 94vw); }
    .modal-sec { border-top: 1px solid var(--line); margin-top: 18px; padding-top: 16px; }
    .block-item {
      border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px;
      margin-top: 10px; background: #f5f8f6;
    }
    .pill.ok { background: var(--ok-soft); color: var(--ok); }
    .pill.bad { background: var(--bad-soft); color: var(--bad); }
    button.danger { color: var(--bad); }
    details.adv { margin-top: 16px; }
    details.adv summary { cursor: pointer; color: var(--muted); font-weight: 600; }
    input[type="time"] { min-height: 38px; }
    .sess { cursor: grab; user-select: none; transition: filter var(--ease), transform var(--ease); }
    .sess:hover { filter: brightness(1.06); }
    .sess.dragging { opacity: .55; cursor: grabbing; }
    .sess.locked-drag { cursor: pointer; }
    .cal-slot { min-height: 28px; transition: background var(--ease); }
    .cal-slot.drop-ok {
      background: var(--open) !important;
      box-shadow: inset 0 0 0 2px #15803d;
    }
    .cal-slot.swap-ok {
      box-shadow: inset 0 0 0 2px var(--clay);
      outline: 2px dashed #c2410c;
      outline-offset: -2px;
    }
    .cal-slot.swap-ok .sess { filter: saturate(1.1) brightness(1.04); }
    .cal-slot.drop-hover {
      background: #b7e4c7 !important;
      box-shadow: inset 0 0 0 2px #166534;
    }
    .cal-slot.swap-ok.drop-hover {
      background: var(--clay-soft) !important;
      box-shadow: inset 0 0 0 2px var(--clay);
    }
    .cal-grid.dnd-active .cal-slot:not(.drop-ok):not(.swap-ok) {
      background: #f5f8f6;
    }
    .chip.swap {
      border-color: #e4cfc4;
      background: var(--clay-soft);
      color: var(--clay);
    }
    .dnd-hint {
      font-size: 13px; color: var(--muted); margin: 0 0 12px;
      padding: 10px 12px; background: rgba(255,255,255,.65); border: 1px solid var(--line);
      border-radius: var(--radius);
    }
    .cal-legend {
      display: flex; flex-wrap: wrap; gap: 10px 16px; font-size: 12px; color: var(--muted);
      margin: 0 0 12px; align-items: center;
    }
    .cal-legend .leg { display: inline-flex; align-items: center; gap: 6px; }
    .cal-legend .swatch {
      width: 14px; height: 14px; border-radius: 4px; display: inline-block;
    }
    .cal-legend .swatch.green { background: var(--open); box-shadow: inset 0 0 0 2px #15803d; }
    .cal-legend .swatch.amber { background: var(--clay-soft); box-shadow: inset 0 0 0 2px var(--clay); outline: 1px dashed #c2410c; }
    .week-layout {
      display: block;
    }
    .week-layout.drawer-open .week-main {
      padding-right: 0;
    }
    @media (min-width: 1100px) {
      .week-layout.drawer-open .week-main {
        padding-right: min(392px, 36vw);
      }
    }
    .session-drawer {
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 16px; box-shadow: var(--shadow);
      width: min(360px, calc(100vw - 24px));
      max-height: calc(100vh - 80px);
      overflow: auto;
      z-index: 35;
      animation: riseIn 180ms ease;
      box-sizing: border-box;
    }
    /* Overlay so the calendar min-width never squeezes the editor. */
    @media (min-width: 720px) {
      .session-drawer {
        position: fixed;
        top: 70px;
        right: 14px;
        bottom: 14px;
        max-height: none;
        height: auto;
      }
    }
    @media (max-width: 719px) {
      .session-drawer {
        margin: 14px 0 0;
        width: 100%;
        max-height: min(70vh, 520px);
      }
    }
    .session-drawer .drawer-head {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      margin: 0 0 8px;
    }
    .session-drawer .drawer-head h3 { margin: 0; font-size: 1.05rem; flex: 1; min-width: 0; }
    .session-drawer .drawer-meta {
      display: flex; flex-wrap: wrap; gap: 6px 10px; margin: 0 0 4px;
      font-size: 12px; color: var(--muted); line-height: 1.35;
    }
    .session-drawer .drawer-meta span {
      white-space: nowrap;
    }
    .session-drawer h3 { margin: 0 0 4px; font-size: 1rem; }
    .session-drawer details.drawer-sec {
      border-top: 1px solid var(--line); margin-top: 10px; padding-top: 10px;
    }
    .session-drawer details.drawer-sec > summary {
      cursor: pointer; font-weight: 600; font-size: 13px; list-style: none;
      display: flex; align-items: center; justify-content: space-between; color: var(--ink);
    }
    .session-drawer details.drawer-sec > summary::-webkit-details-marker { display: none; }
    .session-drawer .add-row {
      display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center;
    }
    .session-drawer .add-row select { width: 100%; min-width: 0; }
    .extend-impact { margin: 6px 0 0; padding-left: 18px; }
    .extend-impact li { margin: 4px 0; }
    table tr.on td { background: var(--accent-soft); }
    .member-list { display: flex; flex-direction: column; gap: 8px; margin: 8px 0; }
    .member-row {
      display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
      font-size: 13px; padding: 8px 10px; border: 1px solid var(--line);
      border-radius: var(--radius-sm); background: #f5f8f6;
    }
    .member-row .member-name { font-weight: 600; word-break: break-word; }
    .member-row .member-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .member-row .pill { white-space: nowrap; margin: 0; }
    .sess-badge {
      display: inline-block; font-size: 9px; font-weight: 700; letter-spacing: .03em;
      padding: 1px 4px; border-radius: 4px; margin-right: 4px; vertical-align: middle;
      background: rgba(0,0,0,.22);
    }
    .sess-badge.auto { background: rgba(255,255,255,.28); }
    .cal-grid.compact-cal > div { min-height: 20px; }
    .cal-grid.compact-cal .sess { font-size: 10px; padding: 2px 4px; line-height: 1.2; }
    .cal-grid.compact-cal .sess-sub { display: none; }
    .cal-grid.compact-cal .sess-badge { display: none; }
    .coverage-banner {
      border: 1px solid #e4cfc4; background: var(--clay-soft); color: var(--clay);
      padding: 10px 12px; border-radius: var(--radius); margin: 0 0 14px; font-size: 13px;
    }
    .coverage-banner.ok { border-color: #b7e4c7; background: var(--ok-soft); color: var(--ok); }
    .print-panel .check-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; margin: 12px 0; }
    .print-panel label.chk { font-weight: 500; display: flex; gap: 8px; align-items: center; margin: 0; }
    .print-panel input[type="checkbox"] { width: auto; }
    .sess .sess-sub { display: block; opacity: .9; font-size: 10px; }
    @media print {
      aside, .top, .no-print, .mob-nav, .tabs, .wizard, .stale, .popover, .session-drawer, .print-panel { display: none !important; }
      body { display: block; background: #fff; }
      main { padding: 0; }
      .week-cals { gap: 24px; }
      .card.cal { break-inside: avoid; box-shadow: none; }
      body.print-week h1,
      body.print-week .lede,
      body.print-week .stat-grid,
      body.print-week .row { display: none !important; }
      body.print-week .print-only { display: block !important; }
      body.print-hide-times .sess-time { display: none !important; }
      body.print-hide-teachers .sess-teacher { display: none !important; }
      body.print-hide-groups .sess-group { display: none !important; }
      body.print-compact .cal-grid > div { min-height: 22px; padding: 1px; }
      body.print-compact .sess { font-size: 10px; padding: 2px 4px; }
    }
    .print-only { display: none; }
    @media (max-width: 980px) {
      .setup-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 720px) {
      body { grid-template-columns: 1fr; grid-template-rows: 58px auto 1fr; grid-template-areas: "top" "mob" "main"; }
      aside { display: none; }
      .mob-nav {
        display: flex; grid-area: mob; gap: 6px; padding: 8px 12px; overflow-x: auto;
        background: rgba(255,255,255,.9); border-bottom: 1px solid var(--line);
      }
      .mob-nav button { white-space: nowrap; }
      .mob-nav button.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
      .stat-grid { grid-template-columns: 1fr 1fr; }
      .form-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="top">
    <div class="brand">Caseload <span>Scheduler</span></div>
    <div class="grow"></div>
    <div class="status" id="status">Ready</div>
    <button type="button" onclick="validateNow()">Check</button>
    <button type="button" id="undo-edit-btn" class="ghost hidden" onclick="undoLastEdit()" title="Undo edit (Ctrl+Z)">Undo</button>
    <button type="button" id="redo-edit-btn" class="ghost hidden" onclick="redoLastEdit()" title="Redo (Ctrl+Shift+Z)">Redo</button>
    <button type="button" class="primary" onclick="generateNow()">Generate schedule</button>
    <button type="button" id="undo-btn" class="hidden" onclick="undoLastGenerate()">Undo generate</button>
  </div>
  <aside>
    <div class="sec">Caseload</div>
    <button type="button" class="nav active" data-view="students" onclick="showView('students')">Students</button>
    <button type="button" class="nav" data-view="setup" onclick="showView('setup')">Hours &amp; grades</button>
    <div class="sec">Schedule</div>
    <button type="button" class="nav" data-view="schedule" onclick="showView('schedule')">Week &amp; coverage</button>
    <div class="sec">File</div>
    <button type="button" class="nav" data-view="files" onclick="showView('files')">Import / export</button>
    <button type="button" class="nav" data-view="settings" onclick="showView('settings')">Settings</button>
  </aside>
  <nav class="mob-nav">
    <button type="button" data-view="students" onclick="showView('students')">Students</button>
    <button type="button" data-view="setup" onclick="showView('setup')">Hours &amp; grades</button>
    <button type="button" data-view="schedule" onclick="showView('schedule')">Schedule</button>
    <button type="button" data-view="files" onclick="showView('files')">File</button>
    <button type="button" data-view="settings" onclick="showView('settings')">Settings</button>
  </nav>
  <main id="main"></main>
  <input id="filePick" type="file" class="hidden" multiple accept=".json,.csv,.xlsx,.xls,text/csv,application/json,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="engine.js"></script>
<script>
'use strict';

const STORE = 'caseload.workspace.v2';
let view = 'students';
let scheduleTab = 'week';
let showAllWeeks = false;
let altFor = null;
let studentQuery = '';
let csvImportMode = 'replace';
let caseloadDirty = false;
let undoSnapshot = null;
let editUndoStack = [];
let editRedoStack = [];
let showPrintPanel = false;
let compactCalendar = false;
let dragState = null; // { index, keys: {'Mon|480': true}, weekLabel }
let suppressSessionClick = false;
let printOpts = {
  teachers: true,
  groups: true,
  times: true,
  grades: true,
  coverage: false,
  compact: false,
  allWeeks: false,
};

function blankWorkspace() {
  return {
    version: 2,
    settings: Object.assign({}, DEFAULT_SETTINGS),
    students: [],
    availability: [],
    grades: [],
    constraints: [],
    scheduleLog: [],
    lastRun: null,
  };
}

function sampleWorkspace() {
  const w = blankWorkspace();
  w.availability = [
    { day: 'Mon-Fri', start: '8:00 AM', end: '11:00 AM', pattern: '', notes: '' },
    { day: 'Mon, Wed', start: '12:30 PM', end: '3:00 PM', pattern: '', notes: '' },
    { day: 'Tue, Thu, Fri', start: '12:30 PM', end: '2:30 PM', pattern: '', notes: '' },
  ];
  w.grades = [
    { grade: '2', day: 'Mon-Fri', start: '11:30 AM', end: '12:15 PM', reason: 'Lunch' },
    { grade: '2', day: 'Tue', start: '1:00 PM', end: '1:45 PM', reason: 'Specials' },
    { grade: 'K', day: 'Mon, Wed', start: '9:00 AM', end: '9:30 AM', reason: 'Recess' },
    { grade: '3', day: 'Mon-Fri', start: '11:00 AM', end: '11:45 AM', reason: 'Lunch' },
  ];
  w.constraints = [
    { studentId: 'SMITHJ01', day: 'Tue', start: '10:00 AM', end: '10:30 AM', reason: 'OT' },
    { studentId: 'JONESM02', day: 'Mon-Fri', start: '8:00 AM', end: '8:30 AM', reason: 'Resource room' },
  ];
  w.students = [
    { id: 'SMITHJ01', firstName: 'John', lastName: 'Smith', grade: '2', serviceType: 'Individual', groupId: '', frequencyType: 'Weekly', minutesPerWeek: 60, preferredSessionLength: '', sessionsPerQuarter: '', quarterlySessionLength: '', notes: '', status: 'Active', teacher: 'Mrs. Lee — Rm 204', fixedDay: '', fixedStart: '' },
    { id: 'JONESM02', firstName: 'Mary', lastName: 'Jones', grade: '2', serviceType: 'Individual', groupId: '', frequencyType: 'Weekly', minutesPerWeek: 90, preferredSessionLength: '', sessionsPerQuarter: '', quarterlySessionLength: '', notes: '', status: 'Active', teacher: 'Mr. Kim — Rm 210', fixedDay: '', fixedStart: '' },
    { id: 'DOEA03', firstName: 'Alex', lastName: 'Doe', grade: 'K', serviceType: 'Individual', groupId: '', frequencyType: 'Quarterly', minutesPerWeek: '', preferredSessionLength: '', sessionsPerQuarter: 8, quarterlySessionLength: 30, notes: '', status: 'Active', teacher: 'Ms. Ray — Rm 101', fixedDay: '', fixedStart: '' },
    { id: 'LEEB04', firstName: 'Bri', lastName: 'Lee', grade: 'K', serviceType: 'Individual', groupId: '', frequencyType: 'Weekly', minutesPerWeek: 30, preferredSessionLength: '', sessionsPerQuarter: '', quarterlySessionLength: '', notes: '', status: 'Active', teacher: 'Ms. Ray — Rm 101', fixedDay: '', fixedStart: '' },
    { id: 'PARKC05', firstName: 'Cam', lastName: 'Park', grade: '3', serviceType: 'Group', groupId: 'G1', groupIds: ['G1'], frequencyType: 'Weekly', minutesPerWeek: 45, preferredSessionLength: '', sessionsPerQuarter: '', quarterlySessionLength: '', notes: '', status: 'Active', teacher: 'Mr. Ade — Rm 305', fixedDay: '', fixedStart: '' },
    { id: 'RIOSD06', firstName: 'Dana', lastName: 'Rios', grade: '3', serviceType: 'Group', groupId: 'G1', groupIds: ['G1'], frequencyType: 'Weekly', minutesPerWeek: 45, preferredSessionLength: '', sessionsPerQuarter: '', quarterlySessionLength: '', notes: '', status: 'Active', teacher: 'Mr. Ade — Rm 305', fixedDay: '', fixedStart: '' },
  ];
  return w;
}

let state = blankWorkspace();

function persist() {
  try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {}
}
function persistCaseload() {
  if ((state.scheduleLog || []).length) {
    caseloadDirty = true;
    refreshLiveReview('Caseload updated — coverage refreshed from the schedule.');
  }
  persist();
}
function hydrate() {
  try {
    const raw = localStorage.getItem(STORE);
    if (raw != null) state = Object.assign(blankWorkspace(), JSON.parse(raw));
  } catch (e) {}
}

function setStatus(msg, kind) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status' + (kind ? ' ' + kind : '');
}

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
}

function showView(id, tab) {
  view = id;
  if (tab) scheduleTab = tab;
  if (id !== 'schedule') altFor = null;
  document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('active', b.getAttribute('data-view') === id));
  render();
}

function engineInput() {
  return {
    settings: state.settings,
    students: state.students,
    availability: state.availability,
    grades: state.grades,
    constraints: state.constraints,
    scheduleLog: state.scheduleLog,
  };
}

function toTimeInput(display) {
  try {
    const m = timeStrToMinutes(display);
    return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
  } catch (e) { return ''; }
}
function fromTimeInput(value) {
  if (!value) return '';
  try { return minutesToTimeStr(timeStrToMinutes(value)); } catch (e) { return value; }
}

function uniqueValues(arr) {
  const set = {};
  arr.forEach(v => { const s = String(v || '').trim(); if (s) set[s] = true; });
  return Object.keys(set).sort();
}
function knownGrades() {
  return uniqueValues(state.grades.map(g => g.grade).concat(state.students.map(s => s.grade)));
}
function knownGroups() {
  const all = [];
  state.students.forEach(s => {
    const ids = (s.groupIds && s.groupIds.length) ? s.groupIds : (s.groupId ? [s.groupId] : []);
    ids.forEach(g => all.push(g));
  });
  return uniqueValues(all);
}
function studentLabel(id) {
  const s = state.students.find(x => x.id === id);
  return s ? (s.lastName + ', ' + s.firstName) : (id || 'Unknown');
}
function studentNeed(s) {
  if ((s.frequencyType || 'Weekly') === 'Quarterly') return (s.sessionsPerQuarter || '?') + ' × ' + (s.quarterlySessionLength || '?') + ' min / qtr';
  return (s.minutesPerWeek || 0) + ' min / week';
}
function coverageFor(id) {
  return reviewRows().find(r => r.id === id);
}
function blocksFor(id) {
  return state.constraints.filter(c => c.studentId === id);
}
function suggestId(s) {
  const last = String(s.lastName || 'X').replace(/[^A-Za-z]/g, '').toUpperCase().slice(0, 8) || 'X';
  const first = String(s.firstName || 'X').replace(/[^A-Za-z]/g, '').toUpperCase().slice(0, 1) || 'X';
  let n = 1, id;
  do { id = last + first + String(n).padStart(2, '0'); n += 1; }
  while (state.students.some(x => x.id === id));
  return id;
}

function staleBanner() {
  if (!caseloadDirty || !(state.scheduleLog || []).length) return '';
  return `<div class="stale no-print">Caseload changed since the last generate. <button class="primary" onclick="generateNow()">Generate again</button></div>`;
}

function snapshotSchedule() {
  return {
    scheduleLog: JSON.parse(JSON.stringify(state.scheduleLog || [])),
    lastRun: state.lastRun ? JSON.parse(JSON.stringify(state.lastRun)) : null,
    caseloadDirty: caseloadDirty,
  };
}

function generateNow() {
  const issues = validateCaseload(state);
  if (issues.length) {
    if (!confirm(issues.length + ' issue(s). First:\n' + issues[0] + '\n\nGenerate anyway?')) {
      setStatus(issues.length + ' issue(s): ' + issues[0], 'bad');
      return;
    }
  }
  const prev = snapshotSchedule();
  const result = runSchedulingEngine(engineInput());
  if (result.error) { setStatus(result.error, 'bad'); return; }
  undoSnapshot = prev;
  editUndoStack = [];
  editRedoStack = [];
  state.scheduleLog = result.logRows;
  state.lastRun = { at: new Date().toISOString(), sessionCount: result.sessionCount, unplaced: result.unscheduled.length, rescued: result.rescuedStudentCount, review: result.review };
  caseloadDirty = false;
  persist();
  setStatus('Scheduled ' + result.sessionCount + ' sessions · ' + result.unscheduled.length + ' unplaced', result.unscheduled.length ? 'bad' : 'ok');
  scheduleTab = 'week';
  showView('schedule');
}

function undoLastGenerate() {
  if (!undoSnapshot) return;
  state.scheduleLog = undoSnapshot.scheduleLog;
  state.lastRun = undoSnapshot.lastRun;
  caseloadDirty = undoSnapshot.caseloadDirty;
  undoSnapshot = null;
  persist();
  setStatus('Restored the previous schedule.', 'ok');
  render();
}

function snapshotForEdit() {
  return {
    scheduleLog: JSON.parse(JSON.stringify(state.scheduleLog || [])),
    lastRun: state.lastRun ? JSON.parse(JSON.stringify(state.lastRun)) : null,
  };
}

function beginEdit(label) {
  if (!(state.scheduleLog || []).length && label !== 'Lock') return;
  editUndoStack.push(Object.assign({ label: label || 'Edit' }, snapshotForEdit()));
  if (editUndoStack.length > 40) editUndoStack.shift();
  editRedoStack = [];
  updateEditUndoButtons();
}

function restoreEditSnapshot(snap) {
  state.scheduleLog = snap.scheduleLog;
  state.lastRun = snap.lastRun;
  persist();
}

function undoLastEdit() {
  if (!editUndoStack.length) return;
  editRedoStack.push(Object.assign({ label: 'Redo point' }, snapshotForEdit()));
  const snap = editUndoStack.pop();
  restoreEditSnapshot(snap);
  altFor = null;
  dragState = null;
  refreshLiveReview('Undid: ' + (snap.label || 'edit') + '.');
  render();
}

function redoLastEdit() {
  if (!editRedoStack.length) return;
  editUndoStack.push(Object.assign({ label: 'Undo point' }, snapshotForEdit()));
  const snap = editRedoStack.pop();
  restoreEditSnapshot(snap);
  refreshLiveReview('Redid edit.');
  render();
}

function updateEditUndoButtons() {
  const u = document.getElementById('undo-edit-btn');
  const r = document.getElementById('redo-edit-btn');
  if (u) u.classList.toggle('hidden', !editUndoStack.length);
  if (r) r.classList.toggle('hidden', !editRedoStack.length);
}

function jumpToStudentSession(studentId) {
  const i = (state.scheduleLog || []).findIndex(row => String(row.studentId) === String(studentId));
  if (i < 0) { setStatus('No session on the calendar for that student yet.', 'bad'); return; }
  altFor = i;
  scheduleTab = 'week';
  showView('schedule');
  requestAnimationFrame(() => {
    const el = document.querySelector('.sess.on') || document.querySelector('.sess[data-log-index="' + i + '"]');
    if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  });
}

function openSessionEditorForStudent(studentId) {
  const i = (state.scheduleLog || []).findIndex(row => String(row.studentId) === String(studentId));
  if (i < 0) { setStatus('No session on the schedule for that student yet.', 'bad'); return; }
  altFor = i;
  scheduleTab = scheduleTab === 'coverage' ? 'coverage' : 'week';
  showView('schedule');
  requestAnimationFrame(() => {
    const pop = document.getElementById('session-popover');
    if (pop) pop.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  });
}

function extensionImpactHtml(impacts) {
  if (!impacts || !impacts.length) return '';
  return '<ul class="meta extend-impact">' + impacts.map(i =>
    `<li>${esc(i.name)}: ${i.before}→${i.after} min placed (need ${i.required}) · <span class="pill ${i.statusAfter === 'Under' ? 'bad' : (i.statusAfter === 'Over' ? 'warn' : 'ok')}">${esc(i.statusAfter || i.statusBefore)}</span></li>`
  ).join('') + '</ul>';
}

function applySessionExtension(newDurationMinutes) {
  if (altFor == null) return;
  const row = state.scheduleLog[altFor];
  if (String(row.locked).toLowerCase() === 'yes') {
    setStatus('Unlock the session before extending it.', 'bad');
    return;
  }
  const check = validateSessionExtension(engineInput(), row, newDurationMinutes);
  if (!check.ok) { setStatus(check.error, 'bad'); return; }
  const over = (check.impacts || []).filter(i => i.statusAfter === 'Over');
  if (over.length && !confirm('Extending may put ' + over.map(o => o.name).join(', ') + ' over required minutes.\n\nExtend anyway?')) return;
  beginEdit('Extend session');
  let start;
  try { start = timeStrToMinutes(row.start); } catch (e) { setStatus('Bad session time.', 'bad'); return; }
  const endStr = minutesToTimeStr(start + Number(newDurationMinutes));
  sessionMateRows(state.scheduleLog, row).forEach(r => {
    r.end = endStr;
    r.duration = Number(newDurationMinutes);
  });
  refreshLiveReview('Session extended to ' + newDurationMinutes + ' min — coverage updated.');
  render();
}

function loadSampleAndGenerate() {
  state = sampleWorkspace();
  caseloadDirty = false;
  persist();
  generateNow();
}

function setupProgress() {
  return {
    hours: (state.availability || []).length > 0,
    grades: (state.grades || []).length > 0,
    students: (state.students || []).length > 0,
  };
}

function needsOnboarding() {
  const p = setupProgress();
  return !p.hours || !p.grades || !p.students;
}

function wizardHtml() {
  if (!needsOnboarding()) return '';
  const p = setupProgress();
  const item = (done, todo, doneText) => done
    ? '<li class="done">' + doneText + '</li>'
    : '<li>' + todo + '</li>';
  return `<div class="wizard no-print">
    <h3>Get a schedule in three steps</h3>
    <p class="meta">Hours, then grade lunches, then students. Or load the sample caseload to see a finished week.</p>
    <ol>
      ${item(p.hours, '<a href="#" onclick="showView(\'setup\');return false">Add your working hours</a>', 'Hours added.')}
      ${item(p.grades, '<a href="#" onclick="showView(\'setup\');return false">Add lunch / recess for each grade</a>', 'Grade blocks added.')}
      ${item(p.students, '<a href="#" onclick="showView(\'students\');return false">Add your first student</a>', 'Students added.')}
    </ol>
    <div class="card-actions">
      <button type="button" class="primary" onclick="loadSampleAndGenerate()">Load sample caseload</button>
    </div>
  </div>`;
}

function validateNow() {
  const issues = validateCaseload(state);
  if (!issues.length) setStatus('Looks ready to generate.', 'ok');
  else setStatus(issues.length + ' issue(s): ' + issues[0], 'bad');
  render();
}

function downloadText(name, text, mime) {
  const blob = new Blob([text], { type: mime || 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 500);
}

function exportWorkspace() {
  downloadText('caseload-workspace.json', JSON.stringify(state, null, 2), 'application/json');
  setStatus('Saved workspace JSON.', 'ok');
}

function exportCsv(kind) {
  const map = {
    students: state.students,
    availability: state.availability,
    grades: state.grades,
    constraints: state.constraints,
    schedule: state.scheduleLog,
  };
  downloadText(kind + '.csv', objectsToCsv(map[kind] || [], CSV_SCHEMAS[kind]), 'text/csv');
  setStatus('Exported ' + kind + '.csv', 'ok');
}

function mergeBy(existing, incoming, keyFn) {
  const map = {};
  existing.forEach(r => { map[keyFn(r)] = r; });
  incoming.forEach(r => { map[keyFn(r)] = Object.assign({}, map[keyFn(r)] || {}, r); });
  return Object.values(map);
}

function importJsonText(text) {
  const data = JSON.parse(text);
  state = Object.assign(blankWorkspace(), data);
  caseloadDirty = false;
  editUndoStack = [];
  editRedoStack = [];
  persist();
  setStatus('Opened workspace.', 'ok');
  render();
}

function importCsvText(name, text) {
  const rows = csvToObjects(text);
  if (!rows.length) { setStatus('Empty CSV.', 'bad'); return; }
  const headers = Object.keys(rows[0]);
  const kind = detectCsvKind(headers, name);
  if (!kind) { setStatus('Could not detect CSV type. Use Apps Script tab names (Students.csv, MyAvailability.csv, …) or web headers.', 'bad'); return; }
  const merge = csvImportMode === 'merge';
  if (!merge && kind === 'students' && state.students.length && !confirm('Replace all ' + state.students.length + ' students with this CSV?')) return;
  if (!merge && kind === 'availability' && state.availability.length && !confirm('Replace all hours with this CSV?')) return;
  if (!merge && kind === 'grades' && state.grades.length && !confirm('Replace all grade blocks with this CSV?')) return;
  if (!merge && kind === 'constraints' && state.constraints.length && !confirm('Replace all student blocks with this CSV?')) return;
  const imports = {};
  imports[kind] = rows;
  applyWorkbookImports(state, imports, { merge: kind === 'settings' ? true : merge });
  if (kind === 'schedule') {
    if ((state.scheduleLog || []).length) refreshLiveReview('Imported schedule.');
    caseloadDirty = false;
  } else {
    caseloadDirty = true;
  }
  persist();
  setStatus((merge && kind !== 'schedule' ? 'Merged ' : 'Imported ') + kind + ' (' + rows.length + ' rows).', 'ok');
  render();
}

function importWorkbookFromSheets(sheetMap, label) {
  const keys = Object.keys(sheetMap);
  if (!keys.length) { setStatus('No recognized input sheets in file.', 'bad'); return; }
  if (!confirm('Import ' + keys.join(', ') + ' from ' + label + '? Input tables will be replaced (schedule kept if not present).')) return;
  applyWorkbookImports(state, sheetMap, { merge: false });
  if (sheetMap.schedule) refreshLiveReview('Imported schedule from workbook.');
  else caseloadDirty = true;
  editUndoStack = [];
  editRedoStack = [];
  persist();
  setStatus('Imported workbook: ' + keys.join(', '), 'ok');
  render();
}

function parseXlsxToImports(buf) {
  if (typeof XLSX === 'undefined') throw new Error('Spreadsheet library not loaded.');
  const wb = XLSX.read(buf, { type: 'array', cellDates: true });
  const imports = {};
  wb.SheetNames.forEach(name => {
    let kind = sheetNameToKind(name);
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { defval: '' });
    if (!rows.length) return;
    if (!kind) kind = detectCsvKind(Object.keys(rows[0]), name);
    if (!kind) return;
    if (!imports[kind]) imports[kind] = [];
    imports[kind] = imports[kind].concat(rows);
  });
  return imports;
}

function importXlsxBuffer(buf, filename) {
  try {
    importWorkbookFromSheets(parseXlsxToImports(buf), filename || 'workbook');
  } catch (e) {
    setStatus('Could not read spreadsheet: ' + e.message, 'bad');
  }
}

async function importMultipleFiles(files) {
  const imports = {};
  let jsonPayload = null;
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    if (/\.xlsx?$/i.test(f.name)) {
      const buf = await f.arrayBuffer();
      const xlsxImports = parseXlsxToImports(buf);
      Object.keys(xlsxImports).forEach(kind => {
        if (!imports[kind]) imports[kind] = [];
        imports[kind] = imports[kind].concat(xlsxImports[kind]);
      });
      continue;
    }
    const text = await f.text();
    if (/\.json$/i.test(f.name) || text.trim().startsWith('{')) {
      jsonPayload = text;
      continue;
    }
    const rows = csvToObjects(text);
    if (!rows.length) continue;
    const kind = detectCsvKind(Object.keys(rows[0]), f.name);
    if (!kind) continue;
    if (!imports[kind]) imports[kind] = [];
    imports[kind] = imports[kind].concat(rows);
  }
  if (Object.keys(imports).length) {
    importWorkbookFromSheets(imports, files.length + ' files');
    if (jsonPayload) setStatus('Imported tables; skipped workspace JSON when combined with CSV/Excel.', 'ok');
    return;
  }
  if (jsonPayload) {
    importJsonText(jsonPayload);
    return;
  }
  setStatus('No recognized CSV/Excel tables in selection.', 'bad');
}

function importText(name, text) {
  if (/\.json$/i.test(name) || text.trim().startsWith('{')) {
    importJsonText(text);
    return;
  }
  importCsvText(name, text);
}

function importBinaryFile(file) {
  const reader = new FileReader();
  reader.onload = () => importXlsxBuffer(reader.result, file.name);
  reader.readAsArrayBuffer(file);
}

function handleFileList(fileList) {
  const files = Array.from(fileList || []);
  if (!files.length) return;
  if (files.length === 1) {
    const f = files[0];
    if (/\.xlsx?$/i.test(f.name)) { importBinaryFile(f); return; }
    const reader = new FileReader();
    reader.onload = () => importText(f.name, reader.result);
    reader.readAsText(f);
    return;
  }
  importMultipleFiles(files);
}

function pickFile() { document.getElementById('filePick').click(); }
document.getElementById('filePick').addEventListener('change', (e) => {
  handleFileList(e.target.files);
  e.target.value = '';
});

function reviewRows() {
  if ((state.scheduleLog || []).length) return reviewFromScheduleLog(engineInput());
  if (state.lastRun && state.lastRun.review) return state.lastRun.review;
  return [];
}

function refreshLiveReview(note) {
  if (!(state.scheduleLog || []).length) return;
  const review = reviewFromScheduleLog(engineInput());
  const under = review.filter(r => r.status === 'Under').length;
  const over = review.filter(r => r.status === 'Over').length;
  const met = review.filter(r => r.status === 'Met' || r.status === 'Over').length;
  if (!state.lastRun) state.lastRun = { at: new Date().toISOString() };
  state.lastRun.review = review;
  state.lastRun.unplaced = under; // surface under-covered as attention metric after edits
  persist();
  let msg = note || 'Schedule updated.';
  if (under || over) {
    msg += ' Coverage: ' + met + '/' + review.length + ' meeting minutes';
    if (under) msg += ' · ' + under + ' under';
    if (over) msg += ' · ' + over + ' over';
    setStatus(msg, under ? 'bad' : 'ok');
  } else {
    setStatus(msg + ' All students meeting minutes.', 'ok');
  }
}

function coverageBannerHtml() {
  const rev = reviewRows();
  if (!rev.length || !(state.scheduleLog || []).length) return '';
  const under = rev.filter(r => r.status === 'Under');
  const over = rev.filter(r => r.status === 'Over');
  if (!under.length && !over.length) {
    return '<div class="coverage-banner ok no-print">Live coverage: every active student is meeting required minutes.</div>';
  }
  const bits = [];
  under.slice(0, 4).forEach(r => bits.push(esc(r.name) + ' under (' + r.scheduled + '/' + r.required + ')'));
  over.slice(0, 4).forEach(r => bits.push(esc(r.name) + ' over (' + r.scheduled + '/' + r.required + ')'));
  const more = (under.length + over.length) > bits.length ? ' …' : '';
  return '<div class="coverage-banner no-print"><b>Coverage needs attention.</b> ' + bits.join(' · ') + more +
    ' <button type="button" onclick="scheduleTab=\'coverage\';render()">Open coverage</button></div>';
}

function formatSessionCell(entry, opts) {
  const o = opts || printOpts;
  const names = entry.names.join(' + ');
  let sub = [];
  if (o.times !== false) sub.push('<span class="sess-time">' + esc(minutesToTimeStr(entry.start) + '–' + minutesToTimeStr(entry.end)) + '</span>');
  if (o.groups && entry.groupId) sub.push('<span class="sess-group">' + esc(entry.groupId) + '</span>');
  if (o.teachers && entry.teachers && entry.teachers.length) {
    const t = entry.teachers.filter(Boolean).filter((v, i, a) => a.indexOf(v) === i);
    if (t.length) sub.push('<span class="sess-teacher">' + esc(t.join(', ')) + '</span>');
  }
  return esc(names) + (sub.length ? '<span class="sess-sub">' + sub.join(' · ') + '</span>' : '');
}

function renderSchedule() {
  const tabs = [['week','Week'],['coverage','Coverage'],['sessions','Sessions'],['open','Open slots']];
  let html = `<h1>Schedule</h1>

    ).join('')}</div>` + staleBanner();
  if (scheduleTab === 'coverage') return html + renderReviewBody();
  if (scheduleTab === 'sessions') return html + renderSessionsBody();
  if (scheduleTab === 'open') return html + renderOpenBody();

function reconcileSessionSlot(logRow) {
  if (!logRow || !(state.scheduleLog || []).length) return;
  const mates = sessionMateRows(state.scheduleLog, logRow);
  const gid = canonicalGroupIdForSlot(mates, state.students);
  if (gid && unifySessionGroupIds(state.scheduleLog, logRow, gid)) persist();
}

function addToSession() {
  const sel = document.getElementById('add-member');
  const studentId = sel && sel.value;
  if (!studentId || altFor == null) return;
  const row = state.scheduleLog[altFor];
  const check = canAddStudentToSession(engineInput(), row, studentId);
  if (!check.ok) { setStatus(check.error, 'bad'); return; }
  if (check.warning && !confirm(check.warning + '\n\nAdd them anyway?')) return;
  beginEdit('Add member');
  const s = state.students.find(x => x.id === studentId);
  let gid = String(row.groupId || '').trim();
  if (!gid) {
    gid = 'EDIT-GROUP-' + Date.now().toString(36).toUpperCase();
    sessionMateRows(state.scheduleLog, row).forEach(r => { r.groupId = gid; });
  }
  state.scheduleLog.push({
    studentId: s.id,
    name: s.firstName + ' ' + s.lastName,
    grade: s.grade,
    groupId: gid,
    week: row.week,
    day: row.day,
    start: row.start,
    end: row.end,
    duration: row.duration,
    teacher: s.teacher || '',
    locked: row.locked || ''
  });
  unifySessionGroupIds(state.scheduleLog, row, gid);
  // Keep altFor on the original row index (still valid)
  refreshLiveReview('Added ' + s.firstName + ' to the session.');
  render();
}

function removeFromSession(studentId) {
  if (altFor == null) return;
  const row = state.scheduleLog[altFor];
  const mates = sessionMateRows(state.scheduleLog, row);
  if (mates.length <= 1) { setStatus('Cannot remove the only member.', 'bad'); return; }
  beginEdit('Remove member');
  const idx = state.scheduleLog.findIndex(r =>
    String(r.studentId) === String(studentId) && sessionSlotKey(r) === sessionSlotKey(row)
  );
  if (idx < 0) return;
  const name = state.scheduleLog[idx].name;
  state.scheduleLog.splice(idx, 1);
  if (altFor === idx) {
    const next = state.scheduleLog.findIndex(r => sessionSlotKey(r) === sessionSlotKey(row));
    altFor = next >= 0 ? next : null;
  } else if (altFor > idx) {
    altFor -= 1;
  }
  refreshLiveReview('Removed ' + name + ' from the session.');
  render();
}

function reconcileAllSessionSlots() {
  const seen = {};

  (state.scheduleLog || []).forEach(r => {
    const k = sessionSlotKey(r);

    seen[k] = true;
    const mates = sessionMateRows(state.scheduleLog, r);
    const gid = canonicalGroupIdForSlot(mates, state.students);
    if (gid && unifySessionGroupIds(state.scheduleLog, r, gid)) changed = true;
  });
  if (changed) persist();
}

function renderWeekGrid(cal, week) {
  const weekLabel = cal.hasSpecificWeeks ? ('Week ' + week) : 'Every Week';
  const inc = cal.inc, start = cal.minStart, rows = cal.rowsCount;
  const cells = {};
  DAYS.forEach(d => { cells[d] = Array.from({ length: rows }, () => null); });
  cal.entries.filter(e => e.weekLabel === 'Every Week' || e.weekLabel === weekLabel).forEach(e => {
    const r0 = Math.max(0, Math.round((e.start - start) / inc));
    const r1 = Math.min(rows, Math.max(r0 + 1, Math.round((e.end - start) / inc)));
    const color = cal.gradeColors[e.grade] || { bg: '#444', text: '#fff' };
    const text = formatSessionCell(e, printOpts);
    if (cells[e.day]) cells[e.day][r0] = {
      span: Math.max(1, r1 - r0), text, color, day: e.day, start: e.start,
      studentId: (e.studentIds && e.studentIds[0]) || '',
      groupId: e.groupId || ''
    };
    for (let r = r0 + 1; r < r1; r++) if (cells[e.day]) cells[e.day][r] = 'skip';
  });
  let html = '<div class="cal-grid' + (compactCalendar ? ' compact-cal' : '') + '" data-week-label="' + esc(weekLabel) + '" data-inc="' + inc + '">';
  html += '<div class="cal-head">Time</div>' + DAYS.map(d => '<div class="cal-head">' + d + '</div>').join('');
  for (let r = 0; r < rows; r++) {
    const slotStart = start + r * inc;
    html += '<div>' + esc(minutesToTimeStr(slotStart)) + '</div>';
    DAYS.forEach(d => {
      const c = cells[d][r];
      if (c === 'skip') return;
      const spanMins = c ? c.span * inc : inc;
      const cellStart = c ? c.start : slotStart;
      const ok = dragState && candidateForSlot(d, cellStart, weekLabel, spanMins) ? ' drop-ok' : '';
      if (!c) {
        html += `<div class="cal-slot${ok}" data-day="${d}" data-start="${slotStart}" data-span="${inc}" data-week="${esc(weekLabel)}"></div>`;
        return;
      }
      const logIdx = findLogIndexForCalendarSlot(state.scheduleLog, c.day, c.start, c.studentId, weekLabel);
      const locked = logIdx >= 0 && String(state.scheduleLog[logIdx].locked).toLowerCase() === 'yes';
      const autoGroup = c.groupId && String(c.groupId).indexOf('AUTO-GROUP-') === 0;
      const badges = (locked ? '<span class="sess-badge lock" title="Locked">🔒</span>' : '') +
        (autoGroup ? '<span class="sess-badge auto">Auto</span>' : '');
      const isSel = logIdx >= 0 && logIdx === altFor;
      html += `<div class="cal-slot${ok}" style="grid-row: span ${c.span}" data-day="${d}" data-start="${c.start}" data-span="${spanMins}" data-week="${esc(weekLabel)}">
        <div class="sess${isSel ? ' on' : ''}${locked ? ' locked-drag' : ''}"
          draggable="${locked ? 'false' : 'true'}"
          data-log-index="${logIdx}"
          title="${locked ? 'Unlock to drag — click to edit' : 'Drag to a green cell, or click to edit'}"
          onclick="onSessionClick('${esc(c.day)}',${c.start},'${esc(c.studentId)}','${esc(weekLabel)}')"
          style="background:${c.color.bg};color:${c.color.text}">${badges}${c.text}</div>
      </div>`;
    });
  }
  return html + '</div>';
}

function onSessionClick(day, startMins, studentId, weekLabel) {
  if (suppressSessionClick) { suppressSessionClick = false; return; }
  openCalendarSession(day, startMins, studentId, weekLabel);
}

function weekKeyFromLabel(weekLabel) {
  if (!weekLabel || weekLabel === 'Every Week') return ALL_WEEKS_KEY;
  const n = Number(String(weekLabel).replace(/[^0-9]/g, ''));
  return Number.isFinite(n) ? n : ALL_WEEKS_KEY;
}

/** Match a calendar cell to the best valid candidate (grid rows are coarser than slotIncrement). */
function candidateForSlot(day, startMins, weekLabel, spanMins) {
  if (!dragState || !dragState.candidates || !dragState.candidates.length) return null;
  const start = Number(startMins);
  const span = Number(spanMins) || 15;
  const week = weekKeyFromLabel(weekLabel);
  const pool = dragState.candidates.filter(c => {
    if (c.day !== day) return false;
    const cw = c.week;
    if (week === ALL_WEEKS_KEY || week === 'ALL') {
      if (cw !== ALL_WEEKS_KEY && cw !== 'ALL' && cw != null && cw !== ANY_WEEK_KEY) return false;
    } else if (Number(cw) !== Number(week) && cw !== ALL_WEEKS_KEY && cw !== 'ALL') {
      return false;
    }
    return c.start >= start && c.start < start + span;
  });
  if (!pool.length) return null;
  pool.sort((a, b) => Math.abs(a.start - start) - Math.abs(b.start - start));
  return pool[0];
}

function moveSessionToCandidate(logIndex, candidate) {
  const row = state.scheduleLog[logIndex];
  if (!row || !candidate) return false;
  const dur = timeStrToMinutes(row.end) - timeStrToMinutes(row.start);
  const mates = sessionMateRows(state.scheduleLog, row);
  mates.forEach(r => {
    r.day = candidate.day;
    r.start = minutesToTimeStr(candidate.start);
    r.end = minutesToTimeStr(candidate.start + dur);
    r.duration = dur;
    if (candidate.week && candidate.week !== ALL_WEEKS_KEY && candidate.week !== 'ALL') {
      r.week = 'Week ' + candidate.week;
    }
  });
  return true;
}

function swapSessionsByIndex(indexA, indexB) {
  const a = state.scheduleLog[indexA];
  const b = state.scheduleLog[indexB];
  if (!a || !b) return false;
  const aMates = sessionMateRows(state.scheduleLog, a);
  const bMates = sessionMateRows(state.scheduleLog, b);
  const aWhen = { day: a.day, start: a.start, end: a.end, week: a.week };
  const bWhen = { day: b.day, start: b.start, end: b.end, week: b.week };
  let aDur, bDur, aStartMin, bStartMin;
  try {
    aDur = timeStrToMinutes(a.end) - timeStrToMinutes(a.start);
    bDur = timeStrToMinutes(b.end) - timeStrToMinutes(b.start);
    aStartMin = timeStrToMinutes(aWhen.start);
    bStartMin = timeStrToMinutes(bWhen.start);
  } catch (e) { return false; }
  aMates.forEach(r => {
    r.day = bWhen.day;
    r.start = bWhen.start;
    r.end = minutesToTimeStr(bStartMin + aDur);
    r.duration = aDur;
    r.week = bWhen.week;
  });
  bMates.forEach(r => {
    r.day = aWhen.day;
    r.start = aWhen.start;
    r.end = minutesToTimeStr(aStartMin + bDur);
    r.duration = bDur;
    r.week = aWhen.week;
  });
  return true;
}

function applyAlt(n) {
  if (altFor == null) return;
  const found = findAlternativeSlots(engineInput(), state.scheduleLog[altFor]);
  const c = found.candidates[n];
  if (!c) return;
  beginEdit('Move session');
  moveSessionToCandidate(altFor, c);
  refreshLiveReview('Moved session (whole group).');
  altFor = null;
  dragState = null;
  render();
}

function applySwap(n) {
  if (altFor == null) return;
  const found = findSwapCandidates(engineInput(), state.scheduleLog[altFor]);
  const s = found.swaps && found.swaps[n];
  if (!s) return;
  const aName = state.scheduleLog[altFor].name;
  beginEdit('Swap sessions');
  if (!swapSessionsByIndex(altFor, s.otherIndex)) {
    editUndoStack.pop();
    updateEditUndoButtons();
    setStatus('Could not swap those sessions.', 'bad');
    return;
  }
  refreshLiveReview('Swapped ' + aName + ' ↔ ' + s.otherLabel + '.');
  altFor = null;
  dragState = null;
  render();
}

function clearDropHighlights() {
  document.querySelectorAll('.cal-slot.drop-ok, .cal-slot.swap-ok, .cal-slot.drop-hover').forEach(el => {
    el.classList.remove('drop-ok', 'swap-ok', 'drop-hover');
  });
  document.querySelectorAll('.cal-grid.dnd-active').forEach(g => g.classList.remove('dnd-active'));
}

function endDragVisual() {
  clearDropHighlights();
  document.querySelectorAll('.sess.dragging').forEach(el => el.classList.remove('dragging'));
}

function swapForOccupiedSlot(slot) {
  if (!dragState || !dragState.swaps || !dragState.swaps.length) return null;
  const sess = slot.querySelector('.sess');
  if (!sess) return null;
  const idx = Number(sess.getAttribute('data-log-index'));
  if (!Number.isFinite(idx) || !state.scheduleLog[idx]) return null;
  const key = sessionKeyFromLogRow(state.scheduleLog[idx]);
  return dragState.swaps.find(s => s.otherKey === key) || null;
}

function paintDropTargets() {
  clearDropHighlights();
  if (!dragState) return;
  document.querySelectorAll('.cal-grid').forEach(g => g.classList.add('dnd-active'));
  document.querySelectorAll('.cal-slot').forEach(slot => {
    const day = slot.getAttribute('data-day');
    const start = slot.getAttribute('data-start');
    const week = slot.getAttribute('data-week');
    const span = slot.getAttribute('data-span');
    if (candidateForSlot(day, start, week, span)) {
      slot.classList.add('drop-ok');
    }
    if (swapForOccupiedSlot(slot)) {
      slot.classList.add('swap-ok');
    }
  });
}

function bindCalendarDnD() {
  if (!document.querySelector('.cal-grid')) return;

  document.querySelectorAll('.sess[draggable="true"]').forEach(el => {
    if (el.dataset.dndBound === '1') return;
    el.dataset.dndBound = '1';
    el.addEventListener('dragstart', (e) => {
      const idx = Number(el.getAttribute('data-log-index'));
      if (!Number.isFinite(idx) || idx < 0 || !state.scheduleLog[idx]) {
        e.preventDefault();
        return;
      }
      const row = state.scheduleLog[idx];
      if (String(row.locked).toLowerCase() === 'yes') {
        e.preventDefault();
        setStatus('Unlock this session before dragging.', 'bad');
        return;
      }
      const found = findAlternativeSlots(engineInput(), row);
      const swapsFound = findSwapCandidates(engineInput(), row);
      if (found.error && !(swapsFound.swaps || []).length) {
        e.preventDefault();
        setStatus(found.error, 'bad');
        return;
      }
      const cands = found.candidates || [];
      const swaps = swapsFound.swaps || [];
      if (!cands.length && !swaps.length) {
        e.preventDefault();
        setStatus('No open slots or valid swaps for this group right now.', 'bad');
        return;
      }
      dragState = { index: idx, candidates: cands, swaps: swaps };
      el.classList.add('dragging');
      suppressSessionClick = true;
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', String(idx)); } catch (err) {}
      paintDropTargets();
      const msg = swaps.length
        ? ('Drop on green to move, or amber to swap (' + swaps.length + ' available). Escape cancels.')
        : 'Drop on a green cell to move this group. Escape cancels.';
      setStatus(msg, 'ok');
    });
    el.addEventListener('dragend', () => {
      dragState = null;
      endDragVisual();
      setTimeout(() => { suppressSessionClick = false; }, 80);
    });
  });

  document.querySelectorAll('.cal-slot').forEach(slot => {
    if (slot.dataset.dndBound === '1') return;
    slot.dataset.dndBound = '1';
    slot.addEventListener('dragover', (e) => {
      if (!dragState) return;
      const day = slot.getAttribute('data-day');
      const start = slot.getAttribute('data-start');
      const week = slot.getAttribute('data-week');
      const span = slot.getAttribute('data-span');
      const cand = candidateForSlot(day, start, week, span);
      const swap = swapForOccupiedSlot(slot);
      if (!cand && !swap) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      slot.classList.add('drop-hover');
    });
    slot.addEventListener('dragleave', () => slot.classList.remove('drop-hover'));
    slot.addEventListener('drop', (e) => {
      if (!dragState) return;
      e.preventDefault();
      e.stopPropagation();
      const day = slot.getAttribute('data-day');
      const start = slot.getAttribute('data-start');
      const week = slot.getAttribute('data-week');
      const span = slot.getAttribute('data-span');
      const swap = swapForOccupiedSlot(slot);
      const cand = candidateForSlot(day, start, week, span);
      const idx = dragState.index;
      const studentId = state.scheduleLog[idx] && state.scheduleLog[idx].studentId;
      const aName = state.scheduleLog[idx] && state.scheduleLog[idx].name;
      dragState = null;
      endDragVisual();
      if (swap) {
        beginEdit('Swap on calendar');
        if (!swapSessionsByIndex(idx, swap.otherIndex)) {
          editUndoStack.pop();
          updateEditUndoButtons();
          setStatus('That swap is not valid.', 'bad');
          return;
        }
        altFor = null;
        refreshLiveReview('Swapped ' + aName + ' ↔ ' + swap.otherLabel + '.');
        suppressSessionClick = true;
        render();
        setTimeout(() => { suppressSessionClick = false; }, 80);
        return;
      }
      if (!cand) {
        setStatus('That slot is not valid for this group.', 'bad');
        return;
      }
      beginEdit('Move on calendar');
      moveSessionToCandidate(idx, cand);
      const movedRow = state.scheduleLog[idx];
      altFor = findLogIndexForCalendarSlot(
        state.scheduleLog, cand.day, cand.start, movedRow.studentId, weekLabelFromCandidateWeek(cand.week)
      );
      if (altFor < 0) altFor = null;
      refreshLiveReview('Moved on the calendar.');
      suppressSessionClick = true;
      render();
      setTimeout(() => { suppressSessionClick = false; }, 80);
    });
  });
}

  let html = `<div class="card"><h3>Other times for ${esc(row.name)}</h3><p class="meta">Open slots that fit current locks and blackouts. Group members move together.</p><div class="chip-row">`;

function removeStudent(idx) {
  const s = state.students[idx];
  if (!s) return;
  if (!confirm('Remove ' + s.firstName + ' ' + s.lastName + '? Their unavailable times will be deleted too.')) return;
  const id = s.id;
  state.students.splice(idx, 1);
  state.constraints = state.constraints.filter(c => c.studentId !== id);
  persistCaseload();
  render();
}

function duplicateStudent(idx) {
  const src = state.students[idx];
  if (!src) return;
  const copy = Object.assign({}, src, { id: suggestId(src) });
  state.students.splice(idx + 1, 0, copy);
  blocksFor(src.id).forEach(b => state.constraints.push(Object.assign({}, b, { studentId: copy.id })));
  persistCaseload();
  render();
  openStudentForm(idx + 1);
}

    const gidCustom = wrap.querySelector('#f-gid');
    const next = {
      id: wrap.querySelector('#f-id').value.trim(),
      firstName: wrap.querySelector('#f-first').value.trim(),
      lastName: wrap.querySelector('#f-last').value.trim(),
      grade: gradePick === '__new__' ? wrap.querySelector('#f-grade-new').value.trim() : gradePick,
      teacher: wrap.querySelector('#f-teacher').value.trim(),
      serviceType: wrap.querySelector('#f-service').value,
      groupId: '',
      groupIds: wrap.querySelector('#f-service').value === 'Group'
        ? parseGroupIds(groupPick === '__new__' || !gidCustom.classList.contains('hidden') ? gidCustom.value : groupPick)
        : [],
      noGroup: wrap.querySelector('#f-service').value === 'Individual' && wrap.querySelector('#f-nogroup').checked,
      frequencyType: wrap.querySelector('#f-freq').value,
      minutesPerWeek: wrap.querySelector('#f-min').value,
      preferredSessionLength: wrap.querySelector('#f-pref').value,
      sessionsPerQuarter: wrap.querySelector('#f-sq').value,
      quarterlySessionLength: wrap.querySelector('#f-ql').value,
      status: wrap.querySelector('#f-status').value,
      notes: wrap.querySelector('#f-notes').value,
      fixedDay: wrap.querySelector('#f-fd').value,
      fixedStart: fromTimeInput(wrap.querySelector('#f-fs').value),
    };
    next.groupId = (next.groupIds && next.groupIds[0]) || '';
    if (!next.firstName || !next.lastName) { alert('First and last name are required.'); return; }
    if (!next.id) next.id = suggestId(next);
    if (state.students.some((row, i) => row.id === next.id && i !== idx)) {
      alert('That student ID is already in use.');
      return;
    }
    if (idx == null) state.students.push(next);
    else {
      const oldId = state.students[idx].id;
      state.students[idx] = next;
      if (oldId !== next.id) state.constraints.forEach(c => { if (c.studentId === oldId) c.studentId = next.id; });
    }
    if (next.serviceType === 'Group' && next.groupIds && next.groupIds.length) {
      (state.scheduleLog || []).forEach(r => {
        if (String(r.studentId) !== String(next.id)) return;
        const gid = String(r.groupId || '').trim();
        if (!gid) r.groupId = next.groupIds[0];
      });
    }
    persistCaseload();
    wrap.remove();
    render();
  };
}

function blockEditorHtml(studentId) {
  const rows = state.constraints.map((c, i) => ({ c, i })).filter(x => x.c.studentId === studentId);
  if (!rows.length) return '<p class="meta">None yet. Grade lunch and specials already apply automatically.</p>';
  return rows.map(({ c, i }) => `<div class="block-item">
    <div class="form-grid">
      <div><label>Reason</label><input value="${esc(c.reason)}" onchange="state.constraints[${i}].reason=this.value;persistCaseload()"></div>
      <div></div>
      <div><label>Start</label><input type="time" step="300" value="${esc(toTimeInput(c.start))}" onchange="state.constraints[${i}].start=fromTimeInput(this.value);persistCaseload()"></div>
      <div><label>End</label><input type="time" step="300" value="${esc(toTimeInput(c.end))}" onchange="state.constraints[${i}].end=fromTimeInput(this.value);persistCaseload()"></div>
    </div>
    <label>Days</label>
    <div class="chip-row">${dayChips(c.day, 'constraints', i)}</div>
    <button class="ghost danger" onclick="removeBlock(${i}, '${esc(studentId)}')">Remove block</button>
  </div>`).join('');
}

function refreshBlockEditor(studentId) {
  const el = document.getElementById('block-editor');
  if (el) el.innerHTML = blockEditorHtml(studentId);
}

function addBlockFor(studentId) {
  state.constraints.push({ studentId: studentId, day: 'Mon', start: '9:00 AM', end: '9:30 AM', reason: 'OT' });
  persistCaseload();
  refreshBlockEditor(studentId);
}

function removeBlock(i, studentId) {
  state.constraints.splice(i, 1);
  persistCaseload();
  refreshBlockEditor(studentId);
}

function dayChips(selected, kind, i) {
  const set = new Set(parseDayList(selected || ''));
  return DAYS.map(d => `<button type="button" class="chip ${set.has(d) ? 'on' : ''}" data-day="${d}" onclick="toggleDay(this,'${kind}',${i})">${d}</button>`).join('');
}

function toggleDay(btn, kind, i) {
  btn.classList.toggle('on');
  const days = Array.from(btn.parentElement.querySelectorAll('.chip.on')).map(b => b.dataset.day);
  const v = days.join(', ');
  if (kind === 'availability') state.availability[i].day = v;
  if (kind === 'grades') state.grades[i].day = v;
  if (kind === 'constraints') state.constraints[i].day = v;
  persistCaseload();
}

function addWindow(kind) {
  if (kind === 'availability') state.availability.push({ day: 'Mon-Fri', start: '8:00 AM', end: '3:00 PM', pattern: '', notes: '' });
  if (kind === 'grades') state.grades.push({ grade: knownGrades()[0] || '', day: 'Mon-Fri', start: '11:30 AM', end: '12:15 PM', reason: 'Lunch' });
  persistCaseload(); render();
}

function copyWindow(kind, i) {
  const src = kind === 'availability' ? state.availability[i] : state.grades[i];
  if (!src) return;
  (kind === 'availability' ? state.availability : state.grades).splice(i + 1, 0, Object.assign({}, src));
  persistCaseload(); render();
}

function addLunchBlock() {
  state.grades.push({ grade: knownGrades()[0] || '', day: 'Mon-Fri', start: '11:30 AM', end: '12:15 PM', reason: 'Lunch' });
  persistCaseload(); render();
}

  return `<h1>Hours &amp; grades</h1>
    <p class="lede">Your working windows, plus grade-level lunch/recess/specials. Student-specific OT or resource times live on the student card.</p>
    ${wizardHtml()}
    ${staleBanner()}
    <div class="setup-grid">
      <div class="setup-col">
        <h2>My hours</h2>
        <p class="meta">When you can see students. Leave pattern blank for every week; A/B for alternating.</p>
        <div class="row"><button class="primary" onclick="addWindow('availability')">Add window</button><button onclick="exportCsv('availability')">CSV</button></div>
        ${`<div class="stack">` + (state.availability.map((w, i) => `<div class="card"><div class="form-grid">
          <div><label>Days</label><div class="chip-row">${dayChips(w.day, 'availability', i)}</div></div>
          <div><label>Pattern</label><select onchange="state.availability[${i}].pattern=this.value;persistCaseload()"><option value="" ${!w.pattern?'selected':''}>Every week</option><option ${w.pattern==='A'?'selected':''}>A</option><option ${w.pattern==='B'?'selected':''}>B</option></select></div>
          <div><label>Start</label><input type="time" step="300" value="${esc(toTimeInput(w.start))}" onchange="state.availability[${i}].start=fromTimeInput(this.value);persistCaseload()"></div>
          <div><label>End</label><input type="time" step="300" value="${esc(toTimeInput(w.end))}" onchange="state.availability[${i}].end=fromTimeInput(this.value);persistCaseload()"></div>
        </div>
        <div class="field"><label>Notes</label><input value="${esc(w.notes)}" onchange="state.availability[${i}].notes=this.value;persistCaseload()"></div>
        <div class="card-actions">
          <button onclick="copyWindow('availability',${i})">Duplicate</button>
          <button class="ghost danger" onclick="state.availability.splice(${i},1);persistCaseload();render()">Remove</button>
        </div></div>`).join('') || '<p class="meta">No hours yet — add a window for the days you work.</p>') + `</div>`}
      </div>
      <div class="setup-col">
        <h2>Grade blocks</h2>
        <p class="meta">Inherited by every student in that grade. Use a student card for one-off conflicts.</p>
        <div class="row"><button class="primary" onclick="addWindow('grades')">Add block</button><button onclick="addLunchBlock()">Add lunch</button><button onclick="exportCsv('grades')">CSV</button></div>
        ${`<div class="stack">` + (state.grades.map((g, i) => `<div class="card"><div class="form-grid">
          <div><label>Grade</label><input list="grade-list" value="${esc(g.grade)}" onchange="state.grades[${i}].grade=this.value;persistCaseload()"></div>
          <div><label>Reason</label><input value="${esc(g.reason)}" onchange="state.grades[${i}].reason=this.value;persistCaseload()"></div>
          <div><label>Start</label><input type="time" step="300" value="${esc(toTimeInput(g.start))}" onchange="state.grades[${i}].start=fromTimeInput(this.value);persistCaseload()"></div>
          <div><label>End</label><input type="time" step="300" value="${esc(toTimeInput(g.end))}" onchange="state.grades[${i}].end=fromTimeInput(this.value);persistCaseload()"></div>
        </div><div class="field"><label>Days</label><div class="chip-row">${dayChips(g.day, 'grades', i)}</div></div>
        <div class="card-actions">
          <button onclick="copyWindow('grades',${i})">Duplicate</button>
          <button class="ghost danger" onclick="state.grades.splice(${i},1);persistCaseload();render()">Remove</button>
        </div></div>`).join('') || '<p class="meta">No grade blocks yet — start with lunch for each grade you serve.</p>') + `</div>`}
        <datalist id="grade-list">${knownGrades().map(g => `<option value="${esc(g)}">`).join('')}</datalist>
      </div>
    </div>`;
}

  return `<h1>Import / export</h1>
    <p class="lede">Workspace auto-saves in this browser. Import a full Google Sheet export (.xlsx), multiple tab CSVs, workspace JSON, or a single CSV table. Apps Script column labels (Students, MyAvailability, Schedule_Log, …) are recognized automatically.</p>
    <div class="drop" id="drop">Drop <b>.xlsx</b> workbook, <b>.json</b>, or <b>.csv</b> (one or many) — or <button onclick="pickFile()">choose files</button></div>
    <div class="row">

function renderSettings() {
  const s = state.settings;
  const num = (key, label) => `<div><label>${label}</label><input type="number" value="${esc(s[key])}" onchange="state.settings.${key}=Number(this.value)||this.value;persist()"></div>`;
  return `<h1>Settings</h1>
    <p class="lede">Everyday knobs. Placement extras live under Advanced — they apply on the next generate.</p>
    <div class="card form-grid">
      ${num('minSessionLength','Min session (min)')}
      ${num('maxSessionLength','Max session (min)')}
      ${num('weeksPerQuarter','Weeks per quarter')}
      <div><label>Starting week pattern</label><select onchange="state.settings.startingWeekPattern=this.value;persist()"><option ${s.startingWeekPattern==='A'?'selected':''}>A</option><option ${s.startingWeekPattern==='B'?'selected':''}>B</option></select></div>
      <div><label>Front-load first sessions (weeks 1–2)</label><select onchange="state.settings.frontLoadFirstSessions=this.value==='true';persist()"><option value="true" ${s.frontLoadFirstSessions?'selected':''}>Yes</option><option value="false" ${!s.frontLoadFirstSessions?'selected':''}>No</option></select></div>
      <div><label>Show teacher on outputs</label><select onchange="state.settings.showTeacherInfo=this.value==='true';persist()"><option value="true" ${s.showTeacherInfo?'selected':''}>Yes</option><option value="false" ${!s.showTeacherInfo?'selected':''}>No</option></select></div>
    </div>
    <details class="adv"><summary>Advanced</summary>
      <div class="card form-grid" style="margin-top:10px">
        ${num('slotIncrement','Slot increment (min)')}
        ${num('groupRescueExtraMinutes','Group rescue extra minutes')}
        ${num('maxGroupSize','Max auto-group size')}
        <div><label>Prefer consistent weekly pattern</label><select onchange="state.settings.preferConsistentPattern=this.value==='true';persist()"><option value="true" ${s.preferConsistentPattern?'selected':''}>Yes</option><option value="false" ${!s.preferConsistentPattern?'selected':''}>No</option></select></div>
      </div>
    </details>`;
}

function render() {
  const main = document.getElementById('main');
  const map = { students: renderStudents, setup: renderSetup, schedule: renderSchedule, files: renderFiles, settings: renderSettings };
  main.innerHTML = (map[view] || renderStudents)();
  const drop = document.getElementById('drop');
  if (drop) {
    drop.ondragover = (e) => { e.preventDefault(); drop.classList.add('hot'); };
    drop.ondragleave = () => drop.classList.remove('hot');
    drop.ondrop = (e) => {
      e.preventDefault(); drop.classList.remove('hot');
      if (e.dataTransfer.files && e.dataTransfer.files.length) {
        handleFileList(e.dataTransfer.files);
        return;
      }
      const f = e.dataTransfer.files[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = () => importText(f.name, reader.result);
      reader.readAsText(f);
    };
  }
  const undoBtn = document.getElementById('undo-btn');
  if (undoBtn) undoBtn.classList.toggle('hidden', !undoSnapshot);
  updateEditUndoButtons();
  const pop = document.getElementById('session-popover');
  if (pop && altFor != null) pop.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  bindCalendarDnD();
}

document.addEventListener('keydown', (e) => {
  const tag = (e.target && e.target.tagName) || '';
  const typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (e.target && e.target.isContentEditable);
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !typing) {
    e.preventDefault();
    if (e.shiftKey) redoLastEdit();
    else undoLastEdit();
    return;
  }
  if (e.key === 'Escape') {
    if (dragState) { dragState = null; endDragVisual(); setStatus('Drag cancelled.', 'ok'); return; }
    if (altFor != null) { altFor = null; render(); }
  }
});
window.addEventListener('afterprint', () => {
  if (!document.body.classList.contains('print-week')) return;
  document.body.classList.remove('print-week');
  render();
});

hydrate();
render();

</script>
